  ${g.warnings.length ? `<h4>Avisos de validación</h4><ul>${g.warnings.map(w => '<li>' + esc(w) + '</li>').join('')}</ul>` : '<h4>Validación</h4><p>Todas las jugadas son legales y cada comentario corresponde a su jugada.</p>'}`);
}

/* ── PGN y prompt ── */
function openPaste(forPrompt) {
  modal(`<h3>${forPrompt ? 'Preparar prompt para IA' : 'Pegar PGN'} ${xBtn()}</h3>
  <p>${forPrompt ? 'Pega la partida en PGN. Se generará el prompt completo para Claude, ChatGPT o Gemini.' : 'Pega una o varias partidas en PGN (Lichess, chess.com, ChessBase, un libro…). Se leen comentarios, variantes, símbolos y flechas.'}</p>
  <textarea id="pgnText" placeholder='[White "Morphy"]\n[Black "Duque de Brunswick"]\n\n1. e4 e5 2. Nf3 d6 3. d4 Bg4 …'></textarea>
  <div class="minep"><label for="pgnMine">¿Es una partida tuya?</label><select id="pgnMine"><option value="">No, es de otros jugadores</option><option value="w">Sí, jugué con blancas</option><option value="b">Sí, jugué con negras</option></select></div>
  <div class="row">${forPrompt ? '<button class="btn primary" data-act="pgn-prompt">Generar prompt</button><button class="btn" data-act="pgn-open">Solo abrir la partida</button>' : '<button class="btn primary" data-act="pgn-open">Abrir partida</button><button class="btn" data-act="pgn-prompt">Preparar prompt para IA</button>'}<button class="btn ghost" data-act="close">Cancelar</button></div>`);
}
function pgnFromPaste() { const t = $('#pgnText'); return t ? t.value.trim() : ''; }
function pasteOpen() {
  const text = pgnFromPaste();
  if (!text) { toast('Pega primero el PGN'); return; }
  try {
    const games = parseImport(text), ids = [], mine = ($('#pgnMine') || {}).value || '';
    games.forEach(g => { if (mine) { g.info = g.info || {}; g.info.coleccion = 'mias'; g.info.miColor = mine; } M.build(g, 'local'); ids.push(addToLib(g, 'local')); });
    closeModal(true);
    if (ids.length === 1) openGameById(ids[0], 0);
    else { toast(ids.length + ' partidas añadidas a tu biblioteca'); renderHome(); }
  } catch (e) { toast(e.message, 5000); }
}
function pastePrompt() {
  const text = pgnFromPaste();
  if (!text) { toast('Pega primero el PGN'); return; }
  try {
    const g = C.parsePGN(text).filter(x => x.moves.length)[0];
    if (!g) throw new Error('No se han encontrado jugadas');
    const r = C.playLine(C.parseFen(g.headers.FEN || C.START_FEN), g.moves.map(m => m.san));
    if (r.error) toast(`Atención: «${r.error.san}» no es legal; revisa el PGN antes de enviarlo`, 5000);
  } catch (e) { toast(e.message, 5000); return; }
  openPrompt(text, ($('#pgnMine') || {}).value || '');
}
// mine: '' (no es del usuario), 'w' o 'b' (color con el que jugó), '?' (suya, color desconocido)
function buildPrompt(pgn, mine) {
  let p = PROMPT_TEMPLATE.replace('{{PGN}}', pgn.trim());
  if (mine) p += PROMPT_MINE.replace('{{COLOR}}', mine === 'w' ? ' con blancas' : mine === 'b' ? ' con negras' : '').replace('{{EXTRA}}', mine === 'w' || mine === 'b' ? ` y "miColor": "${mine}"` : '');
  return p;
}
const PROMPT_MINE = "\n\n## Es una partida del propio alumno\nEsta partida la jugó el alumno{{COLOR}}. Anótala como lo haría su entrenador personal:\n- Sé honesto con sus errores y aciertos, sin suavizarlos: dónde se perdió (o se ganó) la ventaja, qué amenaza pasó por alto y qué debía preguntarse en ese momento.\n- Clasifica cada error importante: táctico (no vio una amenaza o una combinación), estratégico (plan equivocado), de apertura o de técnica en el final.\n- Las lecciones deben ser de 3 a 5 consejos concretos para sus próximas partidas.\n- En \"info\" escribe \"coleccion\": \"mias\"{{EXTRA}}. Como título, una frase que resuma la lección principal de la partida.\n";
function openPrompt(pgn, mine) {
  const p = buildPrompt(pgn, mine);
  modal(`<h3>Prompt para la IA ${xBtn()}</h3>
  <ol><li>Copia el texto completo.</li><li>Pégalo en Claude, ChatGPT o Gemini (usa el modelo más potente; si puede ejecutar código, mejor).</li><li>Descarga el archivo <b>.json</b> que te devuelva.</li><li>Ábrelo con «Abrir archivo» o súbelo a <b>partidas/</b> en GitHub. La app comprobará cada jugada.</li></ol>
  <textarea id="promptText" readonly style="min-height:220px">${esc(p)}</textarea>
  <div class="row"><button class="btn primary" data-act="copy-prompt">Copiar prompt</button><button class="btn" data-act="close">Cerrar</button></div>`);
}

/* ── Glosario ── */
function normKey(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
function openConcept(c) {
  const k = normKey(c), entry = GLOSSARY.find(([t, , al]) => normKey(t) === k || (al || []).some(a => normKey(a) === k)) || GLOSSARY.find(([t]) => k.includes(normKey(t)) || normKey(t).includes(k));
  modal(`<h3>${esc(c)} ${xBtn()}</h3>${entry ? `<p>${esc(entry[1])}</p>${normKey(entry[0]) !== k ? `<p style="color:var(--ink3)">(Entrada del glosario: ${esc(entry[0])})</p>` : ''}` : '<p>Este concepto no está en el glosario integrado. Búscalo en un manual de estrategia o pregúntale a la IA con la posición en FEN (menú ⋯ → Copiar posición).</p>'}
  <h4>Otros conceptos</h4><dl class="gloss">${GLOSSARY.slice(0, 60).map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl>`);
}

/* ── Configurar entrenamiento ── */
function openTrainSetup() {
  const r = V.game.info.result, def = r === '0-1' ? 'b' : 'w';
  modal(`<h3>Adivina la jugada ${xBtn()}</h3>
  <p>Juegas con un bando y tratas de encontrar la jugada que hizo el maestro. Es el método clásico de entrenamiento con partidas comentadas.</p>
  <h4>Bando</h4><div class="opts" id="trSide">${[['w', 'Blancas'], ['b', 'Negras'], ['both', 'Ambos']].map(([v, l]) => `<button class="opt ${v === def ? 'on' : ''}" data-act="trside" data-v="${v}">${l}${(v === 'w' && r === '1-0') || (v === 'b' && r === '0-1') ? ' (ganador)' : ''}</button>`).join('')}</div>
  <h4>Desde</h4><div class="opts" id="trFrom"><button class="opt on" data-act="trfrom" data-v="start">El principio</button>${V.ply > 0 && V.ply < nPlies() ? `<button class="opt" data-act="trfrom" data-v="here">La posición actual (${esc(plainLabel(V.ply))})</button>` : ''}</div>
  <div class="row"><button class="btn primary" data-act="trgo">Empezar</button><button class="btn ghost" data-act="close">Cancelar</button></div>`);
}

/* ═══════════ Eventos, teclado, gestos e inicio ═══════════ */
function onAct(t, e) {
  const a = t.dataset.act, d = t.dataset;
  switch (a) {
    // Inicio
    case 'open': return openGameById(d.id);
    case 'continue': return openGameById(load(KEYS.last, ''));
    case 'del': {
      e.stopPropagation();
      if (d.src === 'github') { const h = getHidden(); if (!h.includes(d.id)) h.push(d.id); save(KEYS.hide, h); toast('Partida oculta. Bórrala de partidas/ en GitHub para eliminarla del todo.', 4500); }
      else { if (!confirm('¿Eliminar esta partida de tu biblioteca?')) return; setLib(getLib().filter(x => x.id !== d.id)); const p = getProg(); delete p[d.id]; save(KEYS.prog, p); }
      return renderHome();
    }
    case 'paste': return openPaste(false);
    case 'prompt': return openPaste(true);
    case 'pick': return $('#fileIn') && $('#fileIn').click();
    case 'sync': return syncGitHub(true);
    case 'ftema': return setFilter('tema', d.v || '');
    case 'tag': e.stopPropagation(); return setFilter('tema', H.f.tema === d.v ? '' : d.v);
    case 'fclear': H.f = Object.assign({}, FILTER_DEFAULTS, { orden: H.f.orden }); save(KEYS.filt, H.f); return renderHome();
    case 'export-lib': return exportLibrary();
    case 'import-lib': { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,.pgn,.txt'; inp.multiple = true; inp.onchange = () => { closeModal(true); importFiles(Array.from(inp.files)); }; return inp.click(); }
    case 'unhide': save(KEYS.hide, []); toast('Se vuelven a mostrar las partidas ocultas'); closeModal(true); return V.game ? null : renderHome();
    case 'reset-progress': if (confirm('¿Borrar el progreso y las puntuaciones de entrenamiento de todas las partidas?')) { save(KEYS.prog, {}); toast('Progreso borrado'); } return;
    case 'settings': return openSettings();
    case 'help': return openHelp();
    case 'license': return openLicense();
    case 'close': return closeModal();
    case 'pref': return applyPrefClick(d.k, d.v);
    case 'pgn-open': return pasteOpen();
    case 'pgn-prompt': return pastePrompt();
    case 'copy-prompt': return copyText($('#promptText').value, 'Prompt copiado: pégalo en tu IA');
    // Visor
    case 'home': return goHome();
    case 'menu': return openMenu(t);
    case 'first': return first();
    case 'prev': return prev();
    case 'next': return next();
    case 'last': return last();
    case 'play': return toggleAutoplay();
    case 'flip': return flip();
    case 'nextkey': return nextKey(1);
    case 'ply': if (V.mode === 'train') return; return go(+d.ply);
    case 'sideply': return sideGo(+d.i);
    case 'exitside': return exitSide();
    case 'explore': return toggleExplore();
    case 'train': return V.mode === 'train' ? stopTrain(false) : openTrainSetup();
    case 'trainsetup': closeModal(true); return openTrainSetup();
    case 'trside': $$('#trSide .opt').forEach(b => b.classList.toggle('on', b === t)); return;
    case 'trfrom': $$('#trFrom .opt').forEach(b => b.classList.toggle('on', b === t)); return;
    case 'trgo': { const side = ($('#trSide .opt.on') || {}).dataset.v || 'w', from = ($('#trFrom .opt.on') || {}).dataset.v || 'start'; closeModal(true); return startTrain(side, from === 'start'); }
    case 'trainskip': return trainSkip();
    case 'traincont': return next();
    case 'trainstop': return stopTrain(false);
    case 'engine': return toggleEngine();
    case 'scan': return scanGame();
    case 'scanstop': return stopScan();
    case 'pv': return openPv(+d.j);
    case 'narrate': setPref('narrate', !P.narrate); if (!P.narrate) Voice.stop(); else Voice.speak(narrationText() || 'Narración activada'); return updateControls();
    case 'answer': V.answers[+d.ply] = true; return updateCard();
    case 'reveal': V.revealed[V.ply] = true; updateCard(); if (P.narrate) Voice.speak(narrationText()); return;
    case 'concept': return openConcept(d.c);
    case 'line': return openNoteLine(+d.ply, +d.j);
    case 'bestline': e.preventDefault(); return openBestLine(+d.ply);
    case 'promo': return choosePromo(d.p);
    case 'prompt-game': return openPrompt(M.pgnFromModel(V.game, false), V.game.info && normKey(V.game.info.coleccion || '') === 'mias' ? (V.game.info.miColor || '?') : '');
    case 'graph': {
      const svg = t, r = svg.getBoundingClientRect(), n = V.game.positions.length - 1;
      if (V.mode === 'train') return;
      return go(Math.round(clamp((e.clientX - r.left) / r.width, 0, 1) * n));
    }
    default:
      if (a.startsWith('m-')) return menuAction(a.slice(2));
  }
}
document.addEventListener('click', e => {
  const sq = e.target.closest('#board .sq');
  if (sq && !e.target.closest('[data-act]')) { onSquare(+sq.dataset.d); return; }
  const t = e.target.closest('[data-act]');
  if (!t) { if (!e.target.closest('#menu')) closeMenu(); return; }
  if (t.closest('#menu') === null && t.dataset.act !== 'menu') closeMenu();
  onAct(t, e);
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Enter' || e.key === ' ') {
    const card = e.target.closest && e.target.closest('.gcard[data-act]');
    if (card && e.target === card) { e.preventDefault(); onAct(card, e); return; }
  }
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable || e.ctrlKey || e.metaKey || e.altKey) {
    if (e.key === 'Escape' && $('#modal')) closeModal();
    return;
  }
  if ($('#modal')) { if (e.key === 'Escape') closeModal(); return; }
  if ($('#menu') && e.key === 'Escape') { closeMenu(); return; }
  const k = e.key;
  if ((k === ' ' || k === 'Enter') && tag === 'button') return;
  if (!V.game) {
    if (k === 's' || k === 'S') openSettings();
    else if (k === '?' || k === 'h') openHelp();
    else if (k === '/') { e.preventDefault(); $('#search') && $('#search').focus(); }
    return;
  }
  const map = {
    ArrowLeft: prev, ArrowRight: next, ArrowUp: first, ArrowDown: last, Home: first, End: last, ' ': toggleAutoplay,
    f: flip, F: flip, n: () => nextKey(1), N: () => nextKey(1), b: () => nextKey(-1), B: () => nextKey(-1),
    t: () => V.mode === 'train' ? stopTrain(false) : openTrainSetup(), T: () => V.mode === 'train' ? stopTrain(false) : openTrainSetup(),
    x: toggleExplore, X: toggleExplore, e: toggleEngine, E: toggleEngine,
    r: () => { if (V.ply) { V.revealed[V.ply] = true; updateCard(); } }, R: () => { if (V.ply) { V.revealed[V.ply] = true; updateCard(); } },
    v: () => onAct({ dataset: { act: 'narrate' } }, e), V: () => onAct({ dataset: { act: 'narrate' } }, e),
    s: openSettings, S: openSettings, '?': openHelp, h: openHelp,
    Escape: () => { if (V.promo) { V.promo = null; updateBoard(); } else if (V.sel >= 0) { V.sel = -1; V.dests = []; updateBoard(); } else if (V.side) exitSide(); else if (V.mode === 'explore') toggleExplore(); else if (V.mode === 'train') stopTrain(false); else goHome(); }
  };
  if (map[k]) { e.preventDefault(); map[k](); }
});
// Gestos: deslizar sobre el comentario o el tablero para avanzar o retroceder
(function () {
  let sx = 0, sy = 0, on = false;
  document.addEventListener('touchstart', e => {
    if (!V.game || !e.touches[0]) return;
    const inCard = e.target.closest('#card'), inBoard = e.target.closest('#board');
    on = !!(inCard || (inBoard && !(V.mode === 'explore' || trainWaiting())));
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!on || !e.changedTouches[0]) return;
    on = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dy) < Math.abs(dx) * 0.6) { if (dx < 0) next(); else prev(); }
  }, { passive: true });
})();
window.addEventListener('popstate', () => {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && findGame(id)) openGameById(id);
  else { stopAutoplay(); if (V.mode === 'train') stopTrain(true); renderHome(); }
});
window.addEventListener('pagehide', () => Voice.stop());

/* ── Inicio ── */
applyPrefs();
(function init() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && findGame(id)) openGameById(id); else renderHome();
  syncGitHub(false).then(() => { if (!V.game && id && findGame(id)) openGameById(id); });
})();

})();
</script>
