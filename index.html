<script>
(function () {
'use strict';
const BUILTIN = [{"id":"clasica-opera-1858","format":"chess-analyzer/2","info":{"title":"La Partida de la Ópera","white":"Paul Morphy","black":"Duque de Brunswick y Conde Isouard","event":"Partida amistosa en el Théâtre-Italien (Salle Ventadour)","site":"París","date":"Otoño de 1858","result":"1-0","opening":"Defensa Philidor","eco":"C41","description":"Morphy juega en un palco de la ópera de París contra dos aristócratas que deciden cada jugada juntos. En 17 jugadas ofrece la lección más clara de la historia sobre el desarrollo: saca sus piezas, abre líneas contra un rey que no se ha enrocado y sacrifica material para llegar antes. Ni siquiera se sabe con certeza qué ópera sonaba (las fuentes dudan entre Norma y El barbero de Sevilla)."},"pgn":"1. e4 e5 2. Nf3 d6 3. d4 Bg4 4. dxe5 Bxf3 5. Qxf3 dxe5 6. Bc4 Nf6 7. Qb3 Qe7 8. Nc3 c6 9. Bg5 b5 10. Nxb5 cxb5 11. Bxb5+ Nbd7 12. O-O-O Rd8 13. Rxd7 Rxd7 14. Rd1 Qe6 15. Bxd7+ Nxd7 16. Qb8+ Nxb8 17. Rd8#","lessons":["Desarrolla antes que comer: Morphy rechaza 8.Qxb7 para sacar el caballo, y gana la partida por tiempos, no por peones.","Un rey en el centro con columnas abiertas es un objetivo: cada sacrificio de Morphy abre una línea nueva hacia e8.","La clavada paraliza: los alfiles de g5 y b5 inmovilizan las piezas negras hasta el final.","Cuenta atacantes y defensores: en d7 las blancas siempre tienen una pieza más en el momento decisivo.","El mate es más rápido que la ventaja material: 16.Qb8+!! fuerza 17.Rd8#."],"analysis":[{"san":"e4","title":"Al centro desde la primera jugada","explanation":"Morphy ocupa el centro y abre a la vez la diagonal de su alfil de f1 y la de la dama. En la época romántica era la forma natural de buscar un ataque rápido.","pros":"Controla d5 y f5; libera alfil y dama.","cons":"El peón de e4 puede convertirse en un blanco.","phase":"apertura","concepts":["Centro","Desarrollo"],"squares":["Gd5","Gf5"]},{"san":"e5","title":"Respuesta simétrica","explanation":"Las negras disputan el centro con la misma moneda y abren paso a su alfil de f8 y a su dama.","pros":"Igualdad central y desarrollo cómodo.","cons":"El peón de e5 podrá ser atacado por Nf3 y d4.","phase":"apertura","concepts":["Centro"]},{"san":"Nf3","title":"Desarrollo con amenaza","explanation":"El caballo sale hacia el centro y ataca el peón de e5. Desarrollar una pieza y crear una amenaza a la vez es ganar un tiempo: el rival debe responder en lugar de desarrollarse.","pros":"Pieza activa, presión sobre e5, prepara el enroque.","cons":"Ninguna significativa.","phase":"apertura","concepts":["Desarrollo","Tiempo"],"arrows":["Rf3e5"]},{"san":"d6","title":"La Defensa Philidor","explanation":"Las negras defienden e5 con un peón, como recomendaba François-André Danican Philidor en el siglo XVIII. Es sólido, pero encierra el alfil de f8 detrás de su propio peón de d6.","pros":"Estructura firme; e5 queda protegido.","cons":"Juego pasivo: el alfil de f8 tardará en salir. 2...Nc6 desarrolla con más actividad.","phase":"apertura","concepts":["Desarrollo","Estructura de peones"],"squares":["Rf8"]},{"san":"d4","title":"Abrir el centro","explanation":"Morphy ataca de inmediato el punto e5. Con el rey negro todavía en e8, abrir el centro favorece al bando que se desarrolla más rápido, y ese es Morphy.","pros":"Gana espacio y abre la columna d.","cons":"Ninguna significativa.","phase":"apertura","concepts":["Ruptura central","Centro"],"arrows":["Rd4e5"]},{"san":"Bg4","title":"Una clavada que cuesta un alfil","explanation":"El alfil clava el caballo de f3 contra la dama para sostener e5. Es natural, pero dudoso: el alfil terminará cambiándose por el caballo y las blancas ganarán tiempo y la pareja de alfiles. Steinitz y Fischer la criticaron; hoy se prefiere 3...exd4 o 3...Nf6.","pros":"Desarrolla una pieza y frena momentáneamente el caballo.","cons":"Tras 4.dxe5 el alfil deberá cambiarse por el caballo, cediendo la pareja de alfiles.","symbol":"?!","phase":"apertura","concepts":["Clavada","Pareja de alfiles"],"arrows":["Rg4d1"],"lines":[{"title":"Lo más sólido: 3...exd4","start":"before","moves":"exd4 Nxd4 Nf6 Nc3 Be7","comment":"Las negras ceden el centro pero desarrollan sin problemas."}]},{"san":"dxe5","title":"Aprovechar la clavada","explanation":"Morphy captura en e5 y pone a las negras ante un problema concreto: si recuperan el peón, pierden otro. Así obliga a cambiar el alfil por el caballo.","pros":"Gana tiempo y fuerza decisiones incómodas.","cons":"Ninguna significativa.","phase":"apertura","concepts":["Clavada","Táctica"],"question":"¿Por qué las negras no pueden recapturar con 4...dxe5?","answer":"Por 5.Qxd8+ Kxd8 6.Nxe5: al desaparecer las damas el caballo ya no está clavado, gana un peón y ataca f7 y g4.","lines":[{"title":"Si 4...dxe5?","start":"after","moves":"dxe5 Qxd8+ Kxd8 Nxe5","comment":"Sin la dama en d1 no hay clavada: el caballo come en e5 y amenaza f7 y g4."}]},{"san":"Bxf3","title":"Un cambio casi obligado","explanation":"Las negras entregan su alfil para poder recuperar el peón. Stockfish prefería 4...Nc6 o 4...Nd7, aceptando estar algo peor, pero para los dos aficionados era la solución práctica.","pros":"Recupera el material tras 5...dxe5.","cons":"Las blancas se quedan con la pareja de alfiles y la dama llega con tiempo a f3.","phase":"apertura","concepts":["Pareja de alfiles"]},{"san":"Qxf3","title":"La dama entra en juego","explanation":"Al recapturar con la dama, Morphy la activa sin perder tiempo y apunta por la columna f hacia f7, el punto más débil del campo negro, defendido solo por el rey.","pros":"Dama activa, presión sobre f7, pareja de alfiles.","cons":"Una dama tan adelantada puede ser hostigada, pero aquí no hay piezas negras capaces de hacerlo.","phase":"apertura","concepts":["Desarrollo","Pareja de alfiles"],"arrows":["Gf3f7"]},{"san":"dxe5","title":"Material igualado, tiempos perdidos","explanation":"Las negras recuperan el peón y el material está igualado. Pero el balance de desarrollo es claro: las blancas tienen dama y caballo activos y la pareja de alfiles, y las negras han hecho tres jugadas de peón y han perdido su alfil de casillas blancas.","pros":"Material igualado.","cons":"Retraso de desarrollo y casillas blancas debilitadas.","phase":"apertura","concepts":["Desarrollo","Tiempo"]},{"san":"Bc4","title":"Segunda pieza contra f7","explanation":"El alfil se une a la dama contra f7: la amenaza es mate en una jugada. Stockfish considera algo más preciso 6.Qb3, pero la idea de Morphy es la misma, coordinar piezas contra el punto débil.","pros":"Desarrollo con amenaza de mate.","cons":"Ninguna significativa.","phase":"apertura","concepts":["Batería","Ataque al rey"],"arrows":["Rc4f7","Rf3f7"],"question":"¿Qué amenazan las blancas?","answer":"7.Qxf7#: dama y alfil atacan f7 y solo el rey lo defiende. Es mate inmediato."},{"san":"Nf6","title":"Tapar la columna... y olvidar b7","explanation":"El caballo cubre la columna f y evita el mate. Pero no resuelve el problema de fondo: Morphy cambiará de frente con 7.Qb3, atacando f7 y b7 a la vez. 6...Qf6 defendía con más solidez.","pros":"Evita el mate y desarrolla una pieza.","cons":"Permite el ataque doble 7.Qb3.","symbol":"?!","phase":"apertura","concepts":["Defensa","Ataque doble"],"lines":[{"title":"Más sólido: 6...Qf6","start":"before","moves":"Qf6 Qb3 Nd7 Qxb7 Rb8 Qa6","comment":"Las negras pierden b7, pero su dama defiende f7 y completan el desarrollo."}]},{"san":"Qb3","title":"Ataque doble","explanation":"La dama cambia de diagonal: desde b3 apunta a f7 (con el alfil delante formando batería) y a b7. Ahora la amenaza es mate en dos, y las negras no pueden cubrir las dos debilidades con comodidad.","pros":"Amenaza mate y el peón de b7.","cons":"Ninguna.","key":true,"phase":"apertura","concepts":["Ataque doble","Batería"],"arrows":["Rb3f7","Rb3b7"],"question":"¿Qué jugaría Morphy si las negras no hicieran nada?","answer":"8.Bxf7+ Kd7 9.Qe6#: mate en dos jugadas."},{"san":"Qe7","title":"Defensa con efectos secundarios","explanation":"La dama defiende f7 desde e7 y evita el mate. El precio es alto: bloquea al alfil de f8, así que el flanco de rey negro sigue sin desarrollar y el enroque queda lejos.","pros":"Defiende f7 y vigila b4.","cons":"Encierra el alfil de f8 y retrasa el enroque.","phase":"apertura","concepts":["Desarrollo","Defensa"],"squares":["Rf8"]},{"san":"Nc3","title":"Desarrollo antes que material","explanation":"Morphy podía ganar un peón con 8.Qxb7, pero tras 8...Qb4+ las damas se cambian y su ataque desaparece. Prefiere sacar otra pieza: en posiciones abiertas, un tiempo de desarrollo vale más que un peón. Es la lección central de la partida.","pros":"Desarrolla, controla d5 y b5, mantiene las damas.","cons":"Renuncia a un peón.","symbol":"!","key":true,"phase":"apertura","concepts":["Desarrollo","Iniciativa","Tiempo"],"lines":[{"title":"El peón tentador: 8.Qxb7","start":"before","moves":"Qxb7 Qb4+ Qxb4 Bxb4+ Bd2","comment":"Las blancas ganan un peón, pero sin damas el ataque se esfuma."}]},{"san":"c6","title":"Cerrar d5 y b5","explanation":"Defiende b7 de forma indirecta (la dama ya no está sola) y quita las casillas d5 y b5 al caballo. Pero es otra jugada de peón: tras ocho jugadas las negras solo han sacado la dama y un caballo.","pros":"Controla d5 y b5; prepara ...b5.","cons":"Debilita d6 y la diagonal a4-e8, por la que llegará el alfil.","phase":"apertura","concepts":["Estructura de peones","Desarrollo"]},{"san":"Bg5","title":"Clavar el caballo","explanation":"El alfil clava el caballo de f6 contra la dama de e7. Las piezas negras apenas pueden moverse y las blancas preparan el enroque largo para llevar la torre a la columna d, abierta.","pros":"Inmoviliza el caballo y prepara O-O-O.","cons":"Ninguna.","phase":"apertura","concepts":["Clavada","Desarrollo"],"arrows":["Rg5e7"]},{"san":"b5","title":"Ganar espacio con el rey en el centro","explanation":"Las negras quieren expulsar al alfil de c4. Es el error decisivo: Morphy no retira nada, sacrifica, y la diagonal a4-e8 y la columna c se abren contra el rey. Stockfish proponía 9...Na6 o 9...Kd8, aunque la posición negra ya era difícil.","pros":"Ataca el alfil.","cons":"Abre líneas hacia su propio rey.","symbol":"?","key":true,"phase":"medio juego","concepts":["Rey en el centro","Apertura de líneas"],"arrows":["Rb5c4"],"lines":[{"title":"Más tenaz: 9...Na6","start":"before","moves":"Na6 Bxf6 gxf6 Bxa6 bxa6","comment":"Las negras sufren, pero no hay un sacrificio inmediato contra su rey."}]},{"san":"Nxb5","title":"El primer sacrificio","explanation":"Morphy entrega el caballo para abrir líneas hacia e8. Steinitz la llamó el primer eslabón de una bellísima combinación. Si las negras no lo toman, el caballo amenaza Nc7+ y Nd6+.","pros":"Abre la diagonal a4-e8 y la columna c.","cons":"Cuesta una pieza: hay que calcular que el ataque compensa.","symbol":"!","key":true,"phase":"medio juego","concepts":["Sacrificio","Apertura de líneas"],"arrows":["Rb5c7","Rb5d6"],"lines":[{"title":"La defensa de los motores: 10...Qb4+","start":"after","moves":"Qb4+ Qxb4 Bxb4+ c3 cxb5 Bxb5+ Ke7 cxb4","comment":"Cambiando damas con jaque las negras pierden material, pero frenan el ataque. Era casi imposible de ver para dos aficionados."}]},{"san":"cxb5","title":"Aceptar el sacrificio","explanation":"La captura natural abre la diagonal hacia e8. Stockfish señala 10...Qb4+ como la defensa más resistente, porque cambia las damas antes de que el ataque llegue.","pros":"Gana una pieza.","cons":"Abre la diagonal b5-e8 a su propio rey.","symbol":"?!","phase":"medio juego","concepts":["Sacrificio"]},{"san":"Bxb5+","title":"Jaque y clavada","explanation":"El alfil recupera el peón con jaque. La pieza que se interponga en d7 quedará clavada al rey. Las blancas tienen ya dos clavadas activas, Bg5 sobre f6 y Bb5 sobre la casilla d7.","pros":"Jaque con tiempo y nueva clavada.","cons":"Ninguna.","phase":"medio juego","concepts":["Clavada","Jaque"],"arrows":["Rb5e8"]},{"san":"Nbd7","title":"Tapar con el caballo","explanation":"Es la forma más razonable de cubrir el jaque. Pero el caballo de d7 queda clavado y esa casilla se convierte en el objetivo de todo el ataque blanco.","pros":"Cubre el jaque y desarrolla.","cons":"Crea una pieza clavada en d7.","phase":"medio juego","concepts":["Clavada"],"squares":["Rd7"]},{"san":"O-O-O","title":"Enroque con ataque","explanation":"Con una sola jugada el rey se pone a salvo y la torre llega a d1, apuntando a la pieza clavada en d7. Aquí el enroque largo no es defensa: es la pieza que faltaba en el ataque.","pros":"Rey seguro y torre activa en la columna abierta.","cons":"Ninguna.","symbol":"!","key":true,"phase":"medio juego","concepts":["Enroque","Columna abierta","Desarrollo"],"arrows":["Gd1d7"]},{"san":"Rd8","title":"Reforzar d7","explanation":"La torre añade otro defensor a d7. Las negras parecen sostenerse, pero Morphy tiene más piezas que lanzar y va a cambiar la cuenta de atacantes y defensores a base de sacrificios.","pros":"Más protección para d7.","cons":"La torre deja la octava fila; el alfil de f8 y la torre de h8 siguen inactivos.","phase":"medio juego","concepts":["Defensa","Clavada"]},{"san":"Rxd7","title":"Eliminar al defensor","explanation":"La torre se entrega por el caballo para destruir la cadena de defensores. Es un sacrificio de calidad (torre por pieza menor) que mantiene la iniciativa.","pros":"Elimina un defensor y mantiene la clavada.","cons":"Entrega material, pero el ataque es imparable.","symbol":"!","key":true,"phase":"medio juego","concepts":["Sacrificio de calidad","Eliminación del defensor"],"question":"¿Por qué las negras no pueden capturar con el caballo, 13...Nxd7?","answer":"Porque al irse el caballo de f6 el alfil de g5 ataca la dama: 14.Bxe7.","lines":[{"title":"Si 13...Nxd7?","start":"after","moves":"Nxd7 Bxe7 Bxe7","comment":"Al moverse el caballo de f6, el alfil de g5 captura la dama."}]},{"san":"Rxd7","title":"Recaptura natural","explanation":"La torre de d8 recupera. Ahora es la torre la que queda clavada en d7 por el alfil de b5.","pros":"Recupera material.","cons":"La pieza de d7 sigue clavada.","phase":"medio juego","concepts":["Clavada"],"squares":["Rd7"]},{"san":"Rd1","title":"Otra pieza contra d7","explanation":"Con calma, Morphy suma un atacante más contra la pieza clavada. Las negras no pueden reforzar d7: el alfil de f8 y la torre de h8 nunca entraron en juego.","pros":"Gana tiempo y presión sobre d7.","cons":"Ninguna.","phase":"medio juego","concepts":["Columna abierta","Clavada"],"arrows":["Gd1d7","Gb5d7"]},{"san":"Qe6","title":"Desclavar el caballo","explanation":"La dama deja e7 para que el caballo de f6 pueda recapturar en d7 y ofrece cambiar damas. Pero llega tarde: Morphy tiene un remate forzado. Stockfish prefería 14...Qb4, aunque la partida ya estaba perdida.","pros":"Libera el caballo y ofrece cambiar damas.","cons":"Permite la combinación final.","phase":"medio juego","concepts":["Defensa"]},{"san":"Bxd7+","title":"Elimina la torre con jaque","explanation":"El alfil captura la torre con jaque y obliga a una pieza negra a ir a d7. Si 15...Qxd7, 16.Qb8+ Ke7 17.Qxe5+ también gana; la jugada de la partida permite el final perfecto.","pros":"Gana material y fuerza la recaptura.","cons":"Ninguna.","phase":"medio juego","concepts":["Táctica"],"lines":[{"title":"Si 15...Qxd7","start":"after","moves":"Qxd7 Qb8+ Ke7 Qxe5+","comment":"La dama entra con jaques y las blancas ganan con facilidad."}]},{"san":"Nxd7","title":"El último error","explanation":"Ahora el caballo de d7 es lo único que tapa la columna d. Si se le obliga a moverse, Rd8 será mate, porque el alfil de g5 protege esa casilla. Morphy tiene mate en dos. 15...Qxd7 resistía más, aunque estaba perdido.","pros":"Recupera la pieza.","cons":"Permite un mate en dos jugadas.","symbol":"?","phase":"medio juego","concepts":["Desviación"],"squares":["Rb8"],"question":"Busca el mate en dos de las blancas.","answer":"16.Qb8+!! Nxb8 17.Rd8#."},{"san":"Qb8+","title":"Sacrificio de dama","explanation":"La dama se ofrece en b8 con jaque. La única respuesta es capturarla con el caballo de d7, y al hacerlo el caballo despeja la columna d: ya nada impide Rd8. Sergeant comparó esta jugada con una hoja de Damasco cortando un cojín de seda.","pros":"Fuerza el mate.","cons":"Entrega la dama, pero da mate en la jugada siguiente.","symbol":"!!","key":true,"phase":"medio juego","concepts":["Sacrificio de dama","Desviación","Mate"],"arrows":["Gd1d8"],"squares":["Rd8"]},{"san":"Nxb8","title":"La única jugada","explanation":"No hay otra jugada legal: el rey no tiene escape y nada puede interponerse. El caballo captura y la columna d queda libre para la torre.","pros":"Gana la dama.","cons":"Despeja la columna d.","phase":"medio juego","concepts":["Desviación"]},{"san":"Rd8#","title":"El mate de la Ópera","explanation":"La torre da mate en d8, protegida por el alfil de g5. El rey no puede ir a d7 (torre) ni a e7 (alfil), y la dama de e6 y el alfil de f8 le quitan sus propias salidas. Morphy da mate con sus dos últimas piezas: así juega quien se desarrolla primero.","pros":"Jaque mate.","cons":"Ninguno.","symbol":"!","key":true,"phase":"medio juego","concepts":["Mate","Coordinación"],"squares":["Gd8","Rd7","Re7"]}],"scan":{"by":"Stockfish 17.1","evals":[31,21,31,27,63,70,115,99,161,164,170,152,232,249,258,238,246,245,366,365,524,538,562,550,588,602,712,728,908,937,"#2","#1","#1","#+0"],"best":["e2e4","e7e5","g1f3","b8c6","d2d4","e5d4","b1c3","b8c6","d1f3","d6e5","f3b3","d8f6","f3b3","f8c5","b3b7","c7c6","c1g5","e8d8","c3b5","e7b4","c4b5","b8d7","e1c1","a8b8","d1d7","f6d7","h1d1","e7b4","b5d7","e6d7","b3b8","d7b8","d1d8",null],"pv":["e2e4 e7e5","e7e5 g1f3 b8c6 f1b5 g8f6 e1g1 f6e4 f1e1","g1f3 b8c6 f1b5 g8f6 e1g1 f6e4 f1e1 e4d6","b8c6 f1b5 g8f6 e1g1 f6e4 f1e1 e4d6 f3e5","d2d4 e5d4 f3d4 g8f6 b1c3 f8e7 c1f4 b8c6","e5d4 f3d4 f8e7 b1c3 g8f6 c1f4 b8c6 d1d2","b1c3","b8c6 e5d6 f8d6 b1c3 d8d7 c1e3 e8c8 d1d3","d1f3 d6e5 f3b3 b8d7 c1e3 f8c5 e3c5 d7c5","d6e5 f3b3 b8d7 c1e3 f8c5 e3c5 d7c5 b3b5","f3b3 b8d7 c1e3 f8c5 e3c5 d7c5 b3b5 c5d7","d8f6 f3b3 b8d7 b3b7 a8b8 b7a6 f6a6 c4a6","f3b3 f8c5 c4f7 e8f8 e1g1 b8c6 f7c4 c6a5","f8c5 c4f7 e8f8 e1g1 b8c6 f7c4 c6a5 b3b5","b3b7 e7b4 b7b4 f8b4 c1d2 a7a5 a2a3 b4c5","c7c6 c1g5 b8a6 g5f6 g7f6 c4a6 b7a6 e1g1","c1g5 e8d8 e1c1 d8c7 c4f7 b8d7 a2a4 a7a5","e8d8 e1c1 d8c7 c4f7 b8d7 a2a4 e7b4 b3e6","c3b5 e7b4 b3b4 f8b4 c2c3 c6b5 c4b5 e8e7","e7b4 b3b4 f8b4 c2c3 c6b5 c4b5 e8e7 c3b4","c4b5 b8d7 e1c1 a8d8 d1d7 f6d7 g5e7 f8e7","b8d7 e1c1 a8b8 g5f6 b8b5 b3b5 g7f6 d1d3","e1c1 a8b8 g5f6 b8b5 b3b5 g7f6 d1d5 f8g7","a8b8 g5f6 b8b5 b3b5 g7f6 d1d5 f8g7 h1d1","d1d7 f6d7 g5e7 f8e7 b3a4 e8g8 b5d7 e7c5","f6d7 g5e7 f8e7 b3a4 e8g8 b5d7 e7c5 c2c3","h1d1 e7d6 b5d7 f6d7 d1d6 f8d6 b3b7 e8g8","e7b4 g5f6 f8c5 b3b4 c5b4 b5d7 e8f8 f6e5","b5d7 e6d7 b3b8 e8e7 b8e5 e7d8 g5f6 g7f6","e6d7 b3b8 e8e7 b8e5 e7d8 g5f6 g7f6 e5f6","b3b8 d7b8 d1d8","d7b8 d1d8","d1d8",""]}},{"id":"clasica-inmortal-1851","format":"chess-analyzer/2","info":{"title":"La Partida Inmortal","white":"Adolf Anderssen","black":"Lionel Kieseritzky","event":"Partida amistosa durante el torneo de Londres 1851","site":"Simpson's Divan, Londres","date":"21/06/1851","result":"1-0","opening":"Gambito de Rey, Gambito del Alfil","eco":"C33","description":"Partida amistosa jugada en Londres durante el primer gran torneo internacional. En 1855 Ernst Falkbeer la bautizó como «la partida inmortal». Anderssen entrega un alfil, las dos torres y la dama para dar mate con tres piezas menores. Los motores actuales encuentran errores en ambos bandos, y precisamente por eso es una lección perfecta sobre tiempo, desarrollo y verificación."},"pgn":"1. e4 e5 2. f4 exf4 3. Bc4 Qh4+ 4. Kf1 b5 5. Bxb5 Nf6 6. Nf3 Qh6 7. d3 Nh5 8. Nh4 Qg5 9. Nf5 c6 10. g4 Nf6 11. Rg1 cxb5 12. h4 Qg6 13. h5 Qg5 14. Qf3 Ng8 15. Bxf4 Qf6 16. Nc3 Bc5 17. Nd5 Qxb2 18. Bd6 Bxg1 19. e5 Qxa1+ 20. Ke2 Na6 21. Nxg7+ Kd8 22. Qf6+ Nxf6 23. Be7#","lessons":["La iniciativa y el desarrollo pueden valer más que mucho material: Anderssen da mate con un ejército mucho menor.","Un rey sin enroque y con las piezas sin desarrollar es vulnerable aunque su bando tenga ventaja material.","Sacar la dama pronto cuesta tiempos: Kieseritzky la mueve ocho veces y nunca desarrolla su flanco de dama.","Las piezas menores coordinadas dan mate: dos caballos y un alfil bastan si las propias piezas encierran al rey.","Verifica las combinaciones famosas: Stockfish prefiere 18.Re1 a 18.Bd6, y con 20...Ba6 las negras evitaban el mate."],"analysis":[{"san":"e4","title":"El peón de rey","explanation":"Anderssen ocupa el centro y abre las diagonales de su alfil de f1 y de la dama, como era habitual en la época romántica.","pros":"Control central y desarrollo rápido.","cons":"El peón de e4 puede ser atacado.","phase":"apertura","concepts":["Centro"]},{"san":"e5","title":"Respuesta simétrica","explanation":"Kieseritzky disputa el centro con su propio peón de rey.","pros":"Igualdad central.","cons":"El peón de e5 será el objetivo del gambito.","phase":"apertura","concepts":["Centro"]},{"san":"f4","title":"¡Gambito de Rey!","explanation":"Anderssen ofrece el peón de f para desviar el de e5 y construir un centro con d4, además de abrir la columna f contra f7. Era la apertura de moda en el siglo XIX. Los motores la consideran ligeramente favorable a las negras, pero en la práctica conduce a posiciones muy afiladas.","pros":"Abre la columna f y prepara el dominio del centro.","cons":"Debilita la diagonal e1-h4 y la protección del rey.","key":true,"phase":"apertura","concepts":["Gambito","Columna abierta","Centro"],"arrows":["Rf4e5","Gd2d4"]},{"san":"exf4","title":"Aceptar el gambito","explanation":"Kieseritzky toma el peón. El peón de f4 estorba al alfil de c1 y controla e3 y g3.","pros":"Peón de ventaja.","cons":"Las blancas ganan tiempo para desarrollarse.","phase":"apertura","concepts":["Gambito"]},{"san":"Bc4","title":"El Gambito del Alfil","explanation":"En lugar del habitual 3.Nf3, Anderssen saca el alfil hacia f7. Acepta que la dama negra dé jaque en h4 a cambio de un desarrollo muy rápido.","pros":"Apunta a f7 y desarrolla una pieza.","cons":"Permite 3...Qh4+.","phase":"apertura","concepts":["Desarrollo","Ataque al rey"],"arrows":["Gc4f7"]},{"san":"Qh4+","title":"Jaque que impide el enroque","explanation":"La dama aprovecha la diagonal e1-h4 que abrió 2.f4. El rey blanco tendrá que ir a f1 y perderá el derecho a enrocar para siempre.","pros":"Las blancas no podrán enrocar.","cons":"La dama sale muy pronto y será un blanco para Nf3, h4 y compañía.","phase":"apertura","concepts":["Jaque","Enroque"],"arrows":["Rh4e1"]},{"san":"Kf1","title":"El rey a f1","explanation":"Es la jugada normal en esta línea. El rey no corre peligro inmediato en f1 y la dama negra deberá retirarse cuando salga el caballo a f3.","pros":"Sale del jaque sin debilitar más la posición.","cons":"Sin enroque, la torre de h1 tardará en entrar en juego.","phase":"apertura","concepts":["Seguridad del rey","Enroque"]},{"san":"b5","title":"El contragambito Bryan","explanation":"Kieseritzky, especialista en esta línea, entrega un peón para desviar el alfil de la diagonal hacia f7. Stockfish considera mejores 4...d5 o 4...Nf6: el peón se pierde sin compensación clara.","pros":"Gana un tiempo sobre el alfil.","cons":"Peón de menos y debilidad en el flanco de dama.","symbol":"?!","phase":"apertura","concepts":["Gambito","Desviación"],"arrows":["Rb5c4"],"lines":[{"title":"Más sólido: 4...d5","start":"before","moves":"d5 Nf3 Qh5 Bxd5 g5","comment":"Las negras devuelven el peón central para desarrollarse y mantener el de f4."}]},{"san":"Bxb5","title":"Aceptar el peón","explanation":"Anderssen acepta. El alfil abandona la diagonal de f7, pero las blancas quedan con un peón de más y el desarrollo intacto.","pros":"Gana un peón.","cons":"El alfil queda lejos del flanco de rey.","phase":"apertura","concepts":["Material"]},{"san":"Nf6","title":"Desarrollo con ataque","explanation":"El caballo se desarrolla y ataca e4. Es la jugada más natural de la posición.","pros":"Desarrolla y presiona e4.","cons":"Ninguna significativa.","phase":"apertura","concepts":["Desarrollo"],"arrows":["Rf6e4"]},{"san":"Nf3","title":"Desarrollo con tiempo","explanation":"El caballo ataca la dama de h4 y defiende h2. Otra pieza blanca que se desarrolla obligando al rival a perder un tiempo.","pros":"Gana un tiempo sobre la dama.","cons":"Ninguna.","phase":"apertura","concepts":["Desarrollo","Tiempo"],"arrows":["Rf3h4"]},{"san":"Qh6","title":"La dama se retira","explanation":"Desde h6 la dama sostiene f4 y vigila la diagonal c1-h6. Es su segunda jugada: las negras acumulan movimientos de dama mientras sus piezas siguen en casa.","pros":"Mantiene el peón de f4.","cons":"Otro tiempo invertido en la dama.","phase":"apertura","concepts":["Tiempo"]},{"san":"d3","title":"Sostener e4","explanation":"Defiende e4 y abre la diagonal del alfil de c1 hacia f4. Stockfish prefiere el más ambicioso 7.d4.","pros":"Estructura sólida y alfil liberado.","cons":"Algo pasiva.","phase":"apertura","concepts":["Centro"]},{"san":"Nh5","title":"Defender f4 desde el borde","explanation":"El caballo defiende f4 y amenaza ...Ng3+, pero se aleja del centro. 7...Nc6 era más natural.","pros":"Defiende f4 y amenaza Ng3+.","cons":"Un caballo en el borde tiene poca influencia.","symbol":"?!","phase":"apertura","concepts":["Caballo en el borde"],"arrows":["Rh5g3"]},{"san":"Nh4","title":"Rumbo a f5","explanation":"Anderssen lleva el caballo hacia f5, una casilla magnífica junto al rey negro. Stockfish prefiere 8.Rg1, que prepara g4 sin retirar el caballo del centro.","pros":"El caballo llegará a f5.","cons":"De momento el caballo está en el borde y la dama negra ganará otro tiempo.","symbol":"?!","phase":"apertura","concepts":["Puesto avanzado"],"arrows":["Gh4f5"]},{"san":"Qg5","title":"La dama, otra vez","explanation":"La dama ataca el caballo de h4. Es su tercera jugada; las negras siguen sin desarrollar alfiles ni torres.","pros":"Obliga al caballo a moverse.","cons":"La dama sigue siendo un blanco.","phase":"apertura","concepts":["Tiempo"],"arrows":["Rg5h4"]},{"san":"Nf5","title":"El caballo dominante","explanation":"El caballo se instala en f5: ataca g7 y vigila d6, e7 y h6, casillas que rodean al rey negro. Desde aquí participará en el mate final.","pros":"Pieza muy activa cerca del rey enemigo.","cons":"Puede ser atacado con ...g6.","phase":"apertura","concepts":["Puesto avanzado","Ataque al rey"],"arrows":["Gf5g7","Gf5d6"]},{"san":"c6","title":"Atacar el alfil","explanation":"Expulsa al alfil de b5, pero es otra jugada que no desarrolla piezas. Stockfish prefería 9...g6, echando al caballo de f5.","pros":"Ataca el alfil.","cons":"Retrasa aún más el desarrollo.","symbol":"?!","phase":"apertura","concepts":["Desarrollo","Tiempo"],"arrows":["Rc6b5"],"lines":[{"title":"Mejor: 9...g6","start":"before","moves":"g6 h4 Qf6 Nc3 Bb7","comment":"Las negras expulsan al caballo de f5 y desarrollan con normalidad."}]},{"san":"g4","title":"Ataque antes que material","explanation":"Anderssen deja el alfil atacado y empuja g4 contra el caballo. Es el espíritu romántico: tiempo y ataque antes que material. Los motores la consideran arriesgada; 10.Ba4 mantenía el equilibrio y 10...g6! habría castigado la idea.","pros":"Gana tiempo sobre el caballo y abre líneas.","cons":"Debilita el flanco de rey blanco y deja el alfil en el aire.","symbol":"!?","key":true,"phase":"medio juego","concepts":["Iniciativa","Sacrificio"],"arrows":["Rg4h5"],"question":"¿Por qué Anderssen no salva el alfil de b5?","answer":"Porque prefiere ganar tiempo contra el caballo de h5 y abrir el flanco de rey: para él, la iniciativa valía más que el alfil.","lines":[{"title":"La refutación: 10...g6!","start":"after","moves":"g6 Rg1 gxf5 gxh5 Qh4","comment":"El caballo de f5 cae y el contraataque negro llega primero."}]},{"san":"Nf6","title":"Retirada","explanation":"El caballo vuelve a f6: dos jugadas para regresar a la misma casilla. Era mejor 10...g6!, contraatacando al caballo de f5.","pros":"Pone el caballo a salvo.","cons":"Pérdida de tiempo.","symbol":"?!","phase":"medio juego","concepts":["Tiempo"]},{"san":"Rg1","title":"La torre en la columna g","explanation":"La torre protege g4 y prepara h4 para expulsar a la dama. Stockfish confirma que es lo mejor: Anderssen ya no se preocupa por el alfil de b5.","pros":"Activa la torre y prepara h4.","cons":"Ninguna.","symbol":"!","phase":"medio juego","concepts":["Columna semiabierta"],"arrows":["Gg1g4"]},{"san":"cxb5","title":"El error que nadie vio","explanation":"Codicioso y natural: las negras ganan el alfil. Pero 11...h5! habría dado la ventaja a las negras. Tras la captura, la dama negra queda acorralada en el flanco de rey y Anderssen gana un tiempo tras otro.","pros":"Gana una pieza.","cons":"Deja que las blancas jueguen h4 y h5 con tiempo sobre la dama.","symbol":"??","key":true,"phase":"medio juego","concepts":["Material","Tiempo"],"question":"¿Qué recibe Anderssen a cambio del alfil?","answer":"Tiempo: con h4 y h5 expulsará a la dama, y Qf3, Bxf4, Nc3 y Nd5 entrarán con amenazas mientras las negras no desarrollan.","lines":[{"title":"La defensa correcta: 11...h5!","start":"before","moves":"h5 h4 Qg6 Ba4 d5 Bxf4 hxg4","comment":"Las negras abren la columna h; Stockfish las prefiere ligeramente."}]},{"san":"h4","title":"Acosar a la dama","explanation":"El peón ataca la dama de g5. La dama negra apenas tiene casillas y cada retirada es un tiempo más para las blancas.","pros":"Gana tiempo y espacio.","cons":"Ninguna.","symbol":"!","phase":"medio juego","concepts":["Tiempo","Iniciativa"],"arrows":["Rh4g5"]},{"san":"Qg6","title":"Retirada obligada","explanation":"Es la única casilla razonable. El peón de h4 seguirá avanzando.","pros":"Salva la dama.","cons":"Las negras siguen sin desarrollarse.","phase":"medio juego","concepts":["Tiempo"]},{"san":"h5","title":"Otra vez con tiempo","explanation":"El peón vuelve a atacar la dama. Las blancas ganan espacio en el flanco de rey sin perder un solo tiempo.","pros":"Más espacio, más tiempo.","cons":"Peones muy avanzados, pero las negras no pueden aprovecharlo.","phase":"medio juego","concepts":["Tiempo","Espacio"],"arrows":["Rh5g6"]},{"san":"Qg5","title":"La dama vuelve a g5","explanation":"Es la quinta jugada de dama de Kieseritzky. Ninguna pieza de su flanco de dama se ha movido.","pros":"La dama sigue activa.","cons":"Desarrollo muy atrasado.","phase":"medio juego","concepts":["Tiempo"]},{"san":"Qf3","title":"La dama blanca entra en juego","explanation":"La dama se coloca en f3 y prepara 15.Bxf4 con un nuevo ataque a la dama negra. Stockfish confirma que es la mejor jugada.","pros":"Coordina la dama con el alfil de c1.","cons":"Ninguna.","phase":"medio juego","concepts":["Desarrollo","Coordinación"],"arrows":["Rc1f4"],"question":"¿Qué amenazan las blancas?","answer":"15.Bxf4, recuperando el peón del gambito y atacando otra vez la dama negra."},{"san":"Ng8","title":"El caballo vuelve a casa","explanation":"El caballo regresa a g8 para dejar la casilla f6 a la dama. Es la cuarta jugada de este caballo y vuelve a su casilla inicial. Stockfish prefería 14...Bb7, desarrollando por fin.","pros":"Prepara ...Qf6.","cons":"Desarrollo nulo: seis piezas negras siguen en su casilla inicial.","symbol":"?!","phase":"medio juego","concepts":["Tiempo","Desarrollo"]},{"san":"Bxf4","title":"Recuperar el peón con tiempo","explanation":"El alfil captura el peón del gambito y ataca la dama. Las blancas tienen desarrollo superior y ataque, y el material está casi equilibrado.","pros":"Recupera material con tiempo.","cons":"Ninguna.","phase":"medio juego","concepts":["Tiempo"],"arrows":["Rf4g5"]},{"san":"Qf6","title":"La dama a f6","explanation":"La dama se refugia en f6, desde donde apunta a b2. Es la mejor casilla disponible.","pros":"Ataca b2 y defiende el flanco de rey.","cons":"Sigue sin desarrollar el resto de piezas.","phase":"medio juego","concepts":["Defensa"],"arrows":["Rf6b2"]},{"san":"Nc3","title":"Completar el desarrollo","explanation":"El último caballo sale con destino d5. Todas las piezas blancas salvo la torre de a1 participan; seis piezas negras siguen en su casilla inicial.","pros":"Desarrollo completo y amenaza Nd5.","cons":"Deja el peón de b2 sin defensa.","phase":"medio juego","concepts":["Desarrollo"],"arrows":["Gc3d5"]},{"san":"Bc5","title":"Desarrollo tardío","explanation":"Por fin sale un alfil, atacando la torre de g1. Stockfish prefería 16...g5 para expulsar al alfil de f4; tras 16...Bc5 las blancas tienen ventaja decisiva.","pros":"Desarrolla y ataca la torre.","cons":"Llega tarde; no defiende al rey.","symbol":"?","phase":"medio juego","concepts":["Desarrollo"],"arrows":["Rc5g1"],"lines":[{"title":"Mejor: 16...g5","start":"before","moves":"g5 Bg3 Na6","comment":"Expulsa al alfil de f4 y gana tiempo para desarrollarse."}]},{"san":"Nd5","title":"El caballo al centro","explanation":"El caballo ataca la dama y amenaza Nc7+, horquilla de rey y torre. Es espectacular, aunque Stockfish encuentra algo aún más preciso, 17.d4.","pros":"Ataca la dama y controla c7 y e7.","cons":"Deja b2 sin defensa.","symbol":"!","key":true,"phase":"medio juego","concepts":["Ataque doble","Puesto avanzado"],"arrows":["Rd5f6","Rd5c7"],"lines":[{"title":"Más preciso: 17.d4","start":"before","moves":"d4 Bf8 Be5 Qc6 Nxg7+","comment":"El peón expulsa al alfil y abre la diagonal; Stockfish valora la posición como ganada."}]},{"san":"Qxb2","title":"Contragolpe","explanation":"La dama come b2 y amenaza la torre de a1 con jaque. Stockfish la considera la mejor jugada: las negras ya estaban perdidas y buscan contrajuego.","pros":"Gana un peón y ataca la torre.","cons":"La dama se aleja todavía más de su rey.","phase":"medio juego","concepts":["Material"],"arrows":["Rb2a1"]},{"san":"Bd6","title":"La jugada legendaria","explanation":"Anderssen deja colgadas las dos torres: la de g1 la ataca el alfil de c5 y la de a1, la dama. A cambio, el alfil corta la retirada del rey. Durante un siglo se le dio «!!». Stockfish muestra que 18.Re1 ganaba con más sencillez y que, tras 18...Qxa1+ 19.Ke2 Qb2!, la ventaja blanca se reduce mucho.","pros":"Encierra al rey negro y prepara una red de mate.","cons":"Objetivamente inferior a 18.Re1.","symbol":"!?","key":true,"phase":"medio juego","concepts":["Sacrificio","Red de mate"],"arrows":["Rc5g1","Rb2a1"],"squares":["Re7","Rf8"],"question":"¿Para qué sirve el alfil en d6?","answer":"Controla e7 y f8: le quita al rey negro sus casillas de escape y prepara el mate.","lines":[{"title":"Más sencillo: 18.Re1","start":"before","moves":"Re1 Bb7 d4 Bf8 Bd6","comment":"Las blancas defienden y conservan un ataque ganador sin regalar material."},{"title":"La defensa de los motores","start":"after","moves":"Qxa1+ Ke2 Qb2 Kd2 Bxg1 e5 Ba6","comment":"Con la dama en b2 defendiendo la segunda fila, las blancas siguen mejor, pero sin mate inmediato."}]},{"san":"Bxg1","title":"La primera torre","explanation":"Kieseritzky gana una torre, pero 18...Qxa1+ 19.Ke2 Qb2! era más resistente, con la dama vigilando la segunda fila.","pros":"Gana una torre.","cons":"El alfil de g1 queda fuera de juego.","symbol":"?","phase":"medio juego","concepts":["Material"]},{"san":"e5","title":"Encerrar a la dama","explanation":"Con un avance de peón Anderssen corta la gran diagonal: la dama negra de b2 ya no puede defender g7. Amenaza Nxg7+ seguido de Bc7#. Stockfish prefiere 19.Re1, pero ambas jugadas ganan.","pros":"Corta la defensa de g7 y amenaza mate.","cons":"Permite que caiga también la torre de a1.","symbol":"!","key":true,"phase":"medio juego","concepts":["Red de mate","Bloqueo"],"squares":["Re5","Rg7"],"question":"¿Qué amenazan ahora las blancas?","answer":"Nxg7+ Kd8 y Bc7#: mate en dos jugadas."},{"san":"Qxa1+","title":"La segunda torre","explanation":"Las negras se llevan la otra torre con jaque. Materialmente van ganando con mucha diferencia, pero ni la dama ni el alfil de g1 defienden a su rey.","pros":"Ventaja material enorme.","cons":"Ninguna pieza negra protege al rey.","phase":"medio juego","concepts":["Material"]},{"san":"Ke2","title":"El rey se aparta","explanation":"El rey sale del jaque y queda a salvo: ninguna pieza negra puede alcanzarlo a tiempo. La amenaza Nxg7+ y Bc7# sigue en pie.","pros":"Rey seguro y amenaza intacta.","cons":"Ninguna.","phase":"medio juego","concepts":["Seguridad del rey"]},{"san":"Na6","title":"El error decisivo","explanation":"El caballo defiende c7 y evita Nxg7+ Kd8 Bc7#. Pero deja otro mate: 21.Nxg7+ Kd8 22.Qf6+!! Nxf6 23.Be7#. La única defensa era 20...Ba6!, que libera la casilla c8 para el rey; las blancas seguirían mejor, pero sin mate.","pros":"Cubre c7.","cons":"Permite un mate en tres.","symbol":"??","key":true,"phase":"medio juego","concepts":["Defensa","Red de mate"],"squares":["Gc7","Rc8"],"question":"¿Qué pieza negra le quitará a su propio rey la última casilla de escape?","answer":"El alfil de c8. Con 20...Ba6 el rey podría huir a c8.","lines":[{"title":"La defensa: 20...Ba6!","start":"before","moves":"Ba6 Nc7+ Kd8 Nxa6","comment":"El rey ya tendría la casilla c8; las blancas siguen mejor, pero la partida continúa."}]},{"san":"Nxg7+","title":"Primer jaque","explanation":"El caballo de f5 come en g7 con jaque. El rey solo tiene una casilla: d8, porque el alfil de d6 cubre e7 y f8.","pros":"Fuerza la posición del rey.","cons":"Ninguna.","symbol":"!","key":true,"phase":"medio juego","concepts":["Jaque","Red de mate"],"arrows":["Rg7e8"],"squares":["Gd8"]},{"san":"Kd8","title":"Única jugada","explanation":"Forzada: es la única jugada legal.","pros":"Ninguna.","cons":"El rey entra en la red.","phase":"medio juego","concepts":["Red de mate"]},{"san":"Qf6+","title":"Sacrificio de dama","explanation":"La dama se entrega en f6 con jaque. Si 22...Ne7, 23.Qxe7#; si 22...Nxf6, 23.Be7#. Anderssen dará mate tras haber entregado las dos torres, un alfil y la dama.","pros":"Mate forzado.","cons":"Ninguno.","symbol":"!!","key":true,"phase":"medio juego","concepts":["Sacrificio de dama","Desviación","Mate"],"squares":["Re7"],"lines":[{"title":"Si 22...Ne7","start":"after","moves":"Ne7 Qxe7#","comment":"También es mate."}]},{"san":"Nxf6","title":"Captura","explanation":"Cualquier jugada pierde. El caballo come la dama y deja la casilla e7 libre para el alfil.","pros":"Gana la dama.","cons":"Mate en una.","phase":"medio juego","concepts":["Desviación"]},{"san":"Be7#","title":"Mate con tres piezas menores","explanation":"El alfil da jaque desde e7, protegido por el caballo de d5. El rey no puede ir a c7 (caballo de d5) ni a e8 (caballo de g7), y su propio alfil de c8 y el peón de d7 le quitan las casillas restantes. Tres piezas menores contra un ejército entero.","pros":"Jaque mate.","cons":"Ninguno.","key":true,"phase":"medio juego","concepts":["Mate","Coordinación"],"squares":["Gc7","Ge8","Rc8","Rd7"]}],"scan":{"by":"Stockfish 17.1","evals":[36,33,21,-62,-56,-69,-58,-57,8,-4,29,26,28,-30,66,-85,-71,-57,25,-137,-64,-54,182,179,191,183,191,195,269,282,279,276,447,334,329,149,352,241,343,371,"#3","#2","#2","#1","#1","#+0"],"best":["e2e4","e7e5","g1f3","e5f4","b1c3","b8c6","e1f1","d7d6","c4b5","c7c6","g1f3","h4h6","d2d4","b8c6","h1g1","g7g6","h4f5","g7g6","b5a4","g7g6","h1g1","h7h5","h2h4","g5g6","h4h5","g6g5","d1f3","c8b7","c1f4","g5f6","b1c3","g7g5","d3d4","f6b2","a1e1","b2a1","a1e1","b2a1","f1e2","c8a6","f5g7","e8d8","f3f6","g8f6","d6e7",null],"pv":["e2e4","e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1","g1f3 b8c6 f1b5 g8f6 e1g1 f6e4 f1e1 e4d6","e5f4 f1c4 b8c6 d2d4 d8h4 e1f1 d7d6 g1f3","b1c3 d8h4 e1e2 h4e7 e2f2 g8f6 g1f3 d7d6","b8c6 d2d4 d8h4 e1f1 d7d6 g1f3 c8g4 f3h4","e1f1 d7d5 c4d5 g7g5 b1c3 b8c6 g1f3 h4h5","d7d6 b1c3","c4b5 c7c6 g1f3 h4h6 b5a4 g8f6 b1c3 b8a6","c7c6 g1f3 h4h6 b5a4 g8f6 b1c3 b8a6 d2d4","g1f3 h4h6 b1c3 c7c6 b5c4 f8b4 e4e5 d7d5","h4h6 b1c3 c7c6 b5c4 f8b4 e4e5 d7d5 e5f6","d2d4 f6e4 d1e2 f7f5 b1c3 c8b7 d4d5 e8d8","b8c6 d1e1","h1g1 c7c6 g2g4 c6b5 g4h5 b8a6 f3d4 d7d5","g7g6","h4f5 g7g6 h2h4 g5f6 b1c3 c8b7 b5c4 c7c6","g7g6 h2h4 g5f6 b1c3 c8b7 b5c4 c7c6 d xf2 28. Re1 Rxe1 29. Qd8+ Bf8 30. Nxe1 Bd5 31. Nf3 Ne4 32. Qb8 b5 33. h4 h5 34. Ne5 Kg7 35. Kg1 Bc5+ 36. Kf1 Ng3+ 37. Ke1 Bb4+ 38. Kd1 Bb3+ 39. Kc1 Ne2+ 40. Kb1 Nc3+ 41. Kc1 Rc2#","lessons":["No dejes el rey en el centro: 11.Bg5?, en lugar de 11.Be2 y enrocar, es el origen de todos los problemas blancos.","Abrir la columna e contra un rey sin enrocar justifica entregar material (11...Na4!!, 13...Nxe4!).","A veces la mejor jugada es dejar la dama atacada: 17...Be6!! es la única que mantiene la ventaja negra.","El molinete: dos piezas que dan jaques descubiertos alternos recogen material en cada vuelta.","Con ventaja material decisiva, coordina las piezas contra el rey: torre, alfiles y caballo superan a la dama sola."],"analysis":[{"san":"Nf3","title":"Apertura flexible","explanation":"Byrne desarrolla el caballo sin comprometer sus peones centrales. Desde aquí puede transponer a muchas aperturas.","pros":"Flexible y sólida.","cons":"Ninguna.","phase":"apertura","concepts":["Desarrollo","Transposición"]},{"san":"Nf6","title":"Simetría","explanation":"Fischer responde igual: el caballo controla d5 y e4.","pros":"Desarrollo sano.","cons":"Ninguna.","phase":"apertura","concepts":["Desarrollo"]},{"san":"c4","title":"Espacio en el flanco de dama","explanation":"El peón de c4 controla d5 y prepara Nc3 y d4, la estructura típica de las aperturas cerradas.","pros":"Gana espacio.","cons":"Ninguna.","phase":"apertura","concepts":["Espacio"]},{"san":"g6","title":"Fianchetto","explanation":"Fischer prepara Bg7, su alfil favorito: desde la gran diagonal presionará d4 y el flanco de dama blanco durante toda la partida.","pros":"Rey seguro y alfil activo en el futuro.","cons":"Debilita levemente f6 y h6.","phase":"apertura","concepts":["Fianchetto"]},{"san":"Nc3","title":"Desarrollo","explanation":"Otro desarrollo natural que vigila d5 y e4.","pros":"Pieza activa.","cons":"Ninguna.","phase":"apertura","concepts":["Desarrollo"]},{"san":"Bg7","title":"El alfil en la gran diagonal","explanation":"El alfil se sitúa en g7. De momento lo tapa el caballo de f6, pero cuando ese caballo salte, su influencia llegará hasta a1.","pros":"Alfil de largo alcance.","cons":"Ninguna.","phase":"apertura","concepts":["Fianchetto"]},{"san":"d4","title":"El centro de peones","explanation":"Byrne ocupa el centro con c4 y d4. Fischer todavía no ha tocado sus peones centrales: es el estilo hipermoderno, que ataca el centro desde lejos en lugar de ocuparlo.","pros":"Centro amplio.","cons":"El centro puede convertirse en un blanco.","phase":"apertura","concepts":["Centro","Hipermodernismo"]},{"san":"O-O","title":"El rey a salvo","explanation":"Fischer enroca pronto. Es un detalle decisivo: su rey estará seguro toda la partida, mientras que el de Byrne nunca llegará a enrocar.","pros":"Rey protegido y torre conectada.","cons":"Ninguna.","key":true,"phase":"apertura","concepts":["Enroque","Seguridad del rey"],"question":"Compara la seguridad de los dos reyes durante el resto de la partida.","answer":"El rey negro enroca en la jugada 4 y nunca estará en peligro; el blanco nunca llegará a enrocar y será el objetivo de todo el ataque."},{"san":"Bf4","title":"Desarrollo activo","explanation":"El alfil sale a f4 y vigila c7 y e5. Stockfish prefiere 5.e4, ocupando más centro, pero la jugada es sana.","pros":"Alfil activo.","cons":"Algo menos ambiciosa que 5.e4.","phase":"apertura","concepts":["Desarrollo"]},{"san":"d5","title":"La Defensa Grünfeld","explanation":"Fischer golpea el centro de inmediato. Por transposición se llega a la Defensa Grünfeld, una de sus aperturas favoritas durante toda su carrera.","pros":"Disputa el centro.","cons":"Ninguna.","phase":"apertura","concepts":["Defensa Grünfeld","Ruptura central"],"arrows":["Rd5c4"]},{"san":"Qb3","title":"Presión sobre d5","explanation":"La dama ataca b7 y, junto al peón de c4, presiona d5. Es una idea conocida contra la Grünfeld, pero saca la dama pronto y Fischer la va a perseguir con sus piezas menores.","pros":"Presiona d5 y b7.","cons":"Dama expuesta.","phase":"apertura","concepts":["Ataque doble"],"arrows":["Rb3d5","Rb3b7"]},{"san":"dxc4","title":"Ceder el centro para ganar tiempos","explanation":"Fischer cambia en c4 sabiendo que la dama blanca, al recapturar, será un blanco para sus piezas menores.","pros":"Gana tiempos contra la dama.","cons":"Cede el centro momentáneamente.","phase":"apertura","concepts":["Tiempo","Centro"]},{"san":"Qxc4","title":"Recuperar el peón","explanation":"La dama recupera el peón y sigue en el centro del tablero.","pros":"Material igualado.","cons":"La dama puede ser hostigada.","phase":"apertura","concepts":["Centro"]},{"san":"c6","title":"Una base sólida","explanation":"El peón de c6 controla d5 y b5 y prepara maniobras como ...Nbd7-b6 o ...Be6 con tiempo sobre la dama.","pros":"Estructura flexible.","cons":"Algo pasiva.","phase":"apertura","concepts":["Estructura de peones"]},{"san":"e4","title":"El gran centro","explanation":"Byrne levanta un centro imponente con e4 y d4. Parece una ventaja, pero su rey sigue en e1, su alfil de f1 sin desarrollar y su dama demasiado expuesta.","pros":"Gran centro de peones.","cons":"Desarrollo incompleto y rey en el centro.","phase":"apertura","concepts":["Centro","Rey en el centro"]},{"san":"Nbd7","title":"Rumbo a b6","explanation":"El caballo se dirige a b6 para atacar la dama. Stockfish prefería 8...Qa5, pero el plan de Fischer es coherente.","pros":"Prepara ...Nb6 con tiempo.","cons":"Algo lenta.","phase":"apertura","concepts":["Desarrollo","Tiempo"]},{"san":"Rd1","title":"Reforzar d4","explanation":"La torre protege d4, pero el flanco de rey sigue sin desarrollar: el alfil de f1 y el rey no se han movido.","pros":"Sostiene el centro.","cons":"Retrasa el enroque.","phase":"apertura","concepts":["Rey en el centro"]},{"san":"Nb6","title":"Atacar la dama","explanation":"El caballo gana un tiempo sobre la dama de c4 y vigila d5 y a4.","pros":"Desarrollo con tiempo.","cons":"Ninguna.","phase":"apertura","concepts":["Tiempo"],"arrows":["Rb6c4"]},{"san":"Qc5","title":"La dama se queda activa","explanation":"Byrne evita retroceder, pero en c5 la dama seguirá expuesta. Stockfish prefería 10.Qb3.","pros":"Dama activa.","cons":"Más ataques con tiempo para las negras.","symbol":"?!","phase":"apertura","concepts":["Tiempo"]},{"san":"Bg4","title":"Presión sobre f3","explanation":"El alfil clava el caballo de f3 contra la torre de d1 y aumenta la presión sobre d4 y e4.","pros":"Desarrolla y clava.","cons":"Ninguna.","phase":"apertura","concepts":["Clavada"],"arrows":["Rg4d1"]},{"san":"Bg5","title":"El error que lo cambia todo","explanation":"Byrne ataca el caballo de f6 en lugar de desarrollar con 11.Be2 y enrocar. Es una pérdida de tiempo con el rey en el centro, y Fischer la castiga con una de las jugadas más famosas de la historia.","pros":"Presiona el caballo de f6.","cons":"Deja el rey en el centro y la columna e sin defensa.","symbol":"?","key":true,"phase":"medio juego","concepts":["Rey en el centro","Desarrollo"],"arrows":["Rg5f6"],"lines":[{"title":"Lo correcto: 11.Be2","start":"before","moves":"Be2 Bxf3 Bxf3 Nfd7 Qa3","comment":"Desarrolla y prepara el enroque; la posición está igualada."}]},{"san":"Na4","title":"Un caballo en la boca del lobo","explanation":"Fischer ofrece el caballo. Si 12.Nxa4, 12...Nxe4 abre la columna e y ataca dama y alfil a la vez. Stockfish confirma que es la única jugada que da ventaja a las negras: las demás conducen a la igualdad.","pros":"Elimina el defensor de e4 y abre líneas.","cons":"Ofrece un caballo, pero el cálculo es exacto.","symbol":"!!","key":true,"phase":"medio juego","concepts":["Sacrificio","Rey en el centro","Columna abierta"],"arrows":["Ra4c3","Rf6e4"],"question":"¿Qué ocurre si las blancas capturan el caballo con 12.Nxa4?","answer":"12...Nxe4: el caballo ataca a la vez la dama de c5 y el alfil de g5, y la columna e se abre contra el rey blanco.","lines":[{"title":"Si 12.Nxa4","start":"after","moves":"Nxa4 Nxe4 Qxe7 Qa5+ b4 Qxa4 Qxe4 Rfe8 Be7 Bxf3 gxf3 Bf8","comment":"La columna e se abre contra el rey blanco y las negras ganan material."}]},{"san":"Qa3","title":"Apartar la dama","explanation":"Byrne no acepta el caballo y aparta la dama. Stockfish lo considera lo mejor, pero la posición ya es difícil.","pros":"Evita lo peor.","cons":"Las negras mantienen la iniciativa.","phase":"medio juego","concepts":["Defensa"]},{"san":"Nxc3","title":"Destruir la estructura","explanation":"Fischer cambia el caballo de c3, que defendía e4. Ahora el peón de e4 queda sin protección.","pros":"Deja e4 indefenso.","cons":"Ninguna.","phase":"medio juego","concepts":["Estructura de peones"],"squares":["Re4"]},{"san":"bxc3","title":"Recaptura obligada","explanation":"13.Qxc3 permitía 13...Nxe4 en peores condiciones. Los peones blancos del flanco de dama quedan débiles.","pros":"Mantiene el material.","cons":"Peones débiles en c3 y a2.","phase":"medio juego","concepts":["Estructura de peones"]},{"san":"Nxe4","title":"Abrir la columna e","explanation":"Fischer captura el peón central y ataca el alfil de g5 y el peón de c3. Si las blancas toman en e7, Fischer entregará la calidad para abrir la columna e contra el rey, que sigue en e1.","pros":"Gana un peón y abre líneas.","cons":"Permite Bxe7, que ataca dama y torre.","symbol":"!","key":true,"phase":"medio juego","concepts":["Sacrificio de calidad","Columna abierta"],"arrows":["Re4g5","Re4c3"]},{"san":"Bxe7","title":"Ganar la calidad","explanation":"Byrne captura en e7 atacando la dama y la torre de f8. Stockfish prefiere 14.Be3, pero las blancas ya estaban mal.","pros":"Gana material.","cons":"Abre todavía más la columna e.","symbol":"?!","phase":"medio juego","concepts":["Material"],"arrows":["Re7d8","Re7f8"]},{"san":"Qb6","title":"La dama al flanco de dama","explanation":"Fischer no defiende la torre de f8: lleva la dama a b6, donde presiona d4 junto con el alfil de g7 y queda lejos de los ataques blancos.","pros":"Presión sobre d4.","cons":"Deja la torre de f8 atacada.","phase":"medio juego","concepts":["Iniciativa"],"arrows":["Rb6d4"]},{"san":"Bc4","title":"Desarrollo, por fin","explanation":"Byrne desarrolla el alfil y renuncia a 15.Bxf8, que abriría aún más su posición. Es la jugada que recomienda Stockfish.","pros":"Desarrolla y prepara el enroque.","cons":"Ya es tarde: el caballo vuelve a entrar.","phase":"medio juego","concepts":["Desarrollo"]},{"san":"Nxc3","title":"Otra vez el caballo","explanation":"El caballo come c3 y ataca la torre de d1.","pros":"Gana un peón y ataca la torre.","cons":"Ninguna.","phase":"medio juego","concepts":["Iniciativa"],"arrows":["Rc3d1"]},{"san":"Bc5","title":"Atacar la dama","explanation":"El alfil ataca la dama de b6 y deja la torre de f8 sin capturar.","pros":"Gana un tiempo.","cons":"El rey sigue en el centro.","phase":"medio juego","concepts":["Ataque"],"arrows":["Rc5b6"]},{"san":"Rfe8+","title":"Jaque en la columna abierta","explanation":"La torre ocupa la columna e con jaque. El rey blanco, que nunca enrocó, tiene que moverse.","pros":"Jaque con tiempo.","cons":"Ninguna.","symbol":"!","phase":"medio juego","concepts":["Columna abierta","Jaque"],"arrows":["Re8e1"]},{"san":"Kf1","title":"El rey huye","explanation":"Es lo más resistente según Stockfish; las alternativas (17.Be2, 17.Ne5 o 17.Kd2) pierden más rápido. La dama negra sigue atacada por el alfil de c5.","pros":"Sale del jaque.","cons":"El rey queda en f1, en la diagonal del futuro alfil de c4.","phase":"medio juego","concepts":["Seguridad del rey"]},{"san":"Be6","title":"El sacrificio de dama","explanation":"En lugar de salvar la dama, Fischer ataca el alfil de c4. Si las blancas toman la dama, el molinete de jaques descubiertos le devuelve más material del que entrega. Stockfish confirma que es la única jugada que mantiene la ventaja: cualquier retirada de la dama deja a las blancas mejor.","pros":"Mantiene la iniciativa.","cons":"Entrega la dama, pero el cálculo es exacto.","symbol":"!!","key":true,"phase":"medio juego","concepts":["Sacrificio de dama","Molinete"],"arrows":["Re6c4"],"squares":["Rb6"],"question":"¿Qué ocurre si las blancas toman la dama con 18.Bxb6?","answer":"18...Bxc4+ y empieza el molinete: caballo y alfil dan jaques alternos y recogen material en cada vuelta.","lines":[{"title":"Si 18.Bxe6","start":"after","moves":"Bxe6 Qb5+ Kg1 Ne2+ Kf1 Ng3+ Kg1 Qf1+ Rxf1 Ne2#","comment":"Un mate de la coz de manual: la dama se sacrifica en f1 y el caballo da mate."},{"title":"Lo mejor para Byrne: 18.Qxc3","start":"after","moves":"Qxc3 Qxc5 dxc5 Bxc3","comment":"Stockfish lo prefiere, pero las negras quedan con una pieza de más."}]},{"san":"Bxb6","title":"Comer la dama","explanation":"Byrne acepta. 18.Qxc3 resistía más, aunque también perdía. Ahora empieza el molinete.","pros":"Gana la dama.","cons":"Permite el molinete.","symbol":"?","phase":"medio juego","concepts":["Material"]},{"san":"Bxc4+","title":"Empieza el molinete","explanation":"El alfil captura el de c4 con jaque. El rey solo puede ir a g1, y a partir de aquí cada salto del caballo será un jaque.","pros":"Jaque que recupera material.","cons":"Ninguna.","key":true,"phase":"medio juego","concepts":["Molinete","Jaque"],"arrows":["Rc4f1"]},{"san":"Kg1","title":"Casi forzada","explanation":"19.Rd3 Bxd3+ era todavía peor. El rey va a g1.","pros":"Sale del jaque.","cons":"Entra en el molinete.","phase":"medio juego","concepts":["Molinete"]},{"san":"Ne2+","title":"Jaque de caballo","explanation":"El caballo da jaque desde e2 y tapa la diagonal del alfil. Cuando el rey vuelva a f1, cada salto del caballo destapará el jaque del alfil de c4.","pros":"Mantiene el molinete.","cons":"Ninguna.","phase":"medio juego","concepts":["Molinete","Jaque a la descubierta"],"arrows":["Re2g1"]},{"san":"Kf1","title":"Única jugada legal","explanation":"El rey solo puede volver a f1.","pros":"Ninguna.","cons":"Queda en la diagonal del alfil.","phase":"medio juego","concepts":["Molinete"]},{"san":"Nxd4+","title":"Jaque a la descubierta","explanation":"El caballo come el peón de d4 y destapa el jaque del alfil de c4. Además ataca el caballo de f3.","pros":"Gana un peón con jaque.","cons":"Ninguna.","phase":"medio juego","concepts":["Molinete","Jaque a la descubierta"],"arrows":["Rc4f1"]},{"san":"Kg1","title":"Volver a g1","explanation":"21.Qd3 o 21.Rd3 perdían todavía más material.","pros":"Sale del jaque.","cons":"Ninguna.","phase":"medio juego","concepts":["Molinete"]},{"san":"Ne2+","title":"Vuelve el caballo","explanation":"El caballo regresa a e2 con jaque para preparar el siguiente descubierto.","pros":"Mantiene la iniciativa.","cons":"Ninguna.","phase":"medio juego","concepts":["Molinete"],"arrows":["Re2g1"]},{"san":"Kf1","title":"Única jugada legal","explanation":"De nuevo el rey solo puede ir a f1.","pros":"Ninguna.","cons":"Ninguna.","phase":"medio juego","concepts":["Molinete"]},{"san":"Nc3+","title":"Otro descubierto","explanation":"Nuevo jaque descubierto del alfil, y ahora el caballo ataca la torre de d1.","pros":"Ataca la torre con jaque.","cons":"Ninguna.","phase":"medio juego","concepts":["Molinete","Jaque a la descubierta"],"arrows":["Rc3d1"]},{"san":"Kg1","title":"Fin del molinete","explanation":"El rey vuelve a g1. 23.Rd3 perdía aún más.","pros":"Sale del jaque.","cons":"La torre de d1 sigue atacada.","phase":"medio juego","concepts":["Molinete"]},{"san":"axb6","title":"Recuperar la pieza","explanation":"Fischer recupera el alfil de b6. Ha entregado la dama, pero tiene dos alfiles y un caballo muy activos, y la torre de d1 está atacada.","pros":"Ventaja material y actividad.","cons":"Ninguna.","key":true,"phase":"medio juego","concepts":["Material"]},{"san":"Qb4","title":"Atacar el alfil","explanation":"La dama ataca el alfil de c4 y el peón de b6.","pros":"Crea amenazas.","cons":"La dama sola no puede detener a tantas piezas.","phase":"final","concepts":["Ataque doble"],"arrows":["Rb4c4","Rb4b6"]},{"san":"Ra4","title":"Torre al ataque","explanation":"La torre ataca la dama. Si 25.Qxa4 const PROMPT_TEMPLATE = "Eres un entrenador de ajedrez de nivel Gran Maestro y un gran divulgador. Vas a anotar una partida para un jugador de club que la estudiará jugada a jugada en una aplicación. La aplicación comprueba cada jugada, dibuja tus flechas sobre el tablero y compara tus valoraciones con Stockfish, así que la precisión importa más que la retórica.\n\nPARTIDA (PGN):\n{{PGN}}\n\n## Cómo trabajar, en este orden\n1. Reproduce la partida y comprueba que todas las jugadas son legales. Si puedes ejecutar código, usa python-chess para leer el PGN, obtener el SAN exacto de cada jugada y verificar variantes, flechas y casillas. Si dispones de un motor (Stockfish), úsalo para las valoraciones y para encontrar las mejores alternativas.\n2. Identifica la apertura (nombre y código ECO), los temas principales de la partida, los planes de cada bando, los 4-8 momentos clave (sacrificios, errores, cambios de valoración) y entre 3 y 6 lecciones generales.\n3. Anota cada media jugada.\n\n## Qué escribir en cada jugada\n- \"explanation\": de 2 a 5 frases con ideas concretas: qué amenaza, qué defiende, qué plan sigue, qué pieza o casilla es el objetivo. Cita jugadas («amenaza 12.Nxf7+») en lugar de generalidades («mejora la posición»). En jugadas forzadas u obvias basta una frase.\n- \"pros\" y \"cons\": una línea cada uno. Si no hay contras, escribe «Ninguna significativa.».\n- Sé honesto: si una jugada famosa no es la mejor según el análisis moderno, dilo y explica cuál era mejor. No inventes datos históricos.\n- En los momentos clave añade una pregunta para que el alumno piense antes de leer, con su respuesta.\n- Partidas largas (más de 60 jugadas): sé breve en las jugadas forzadas o evidentes para que todo quepa en un único archivo, pero no omitas ninguna entrada.\n- Variantes (\"lines\"): solo cuando aporten algo (la mejor jugada que no se jugó, la refutación de un error, la amenaza que se evita). Cortas: de 2 a 8 medias jugadas, todas legales.\n\n## Formato de salida\nDevuelve un ARCHIVO .json descargable llamado blancas-vs-negras-año.json (por ejemplo kasparov-vs-topalov-1999.json). Si no puedes crear archivos, responde SOLO con el JSON: sin texto antes ni después y sin bloques de código.\n\nEjemplo de la estructura. Solo se muestran dos entradas de \"analysis\" (1.e4 y 2.f4) para ver todos los campos; tú incluirás TODAS las medias jugadas, también 1...e5:\n\n{\n  \"format\": \"chess-analyzer/2\",\n  \"info\": {\n    \"title\": \"La Partida Inmortal\",\n    \"white\": \"Adolf Anderssen\",\n    \"black\": \"Lionel Kieseritzky\",\n    \"whiteElo\": \"\",\n    \"blackElo\": \"\",\n    \"event\": \"Partida amistosa, Londres\",\n    \"site\": \"Londres\",\n    \"date\": \"21/06/1851\",\n    \"result\": \"1-0\",\n    \"opening\": \"Gambito de Rey, Gambito del Alfil\",\n    \"eco\": \"C33\",\n    \"temas\": [\"Sacrificio y combinación\", \"Ataque al rey\", \"Apertura y desarrollo\"],\n    \"nivel\": \"basico\",\n    \"description\": \"Dos o tres frases sobre por qué merece la pena estudiar esta partida.\"\n  },\n  \"pgn\": \"1. e4 e5 2. f4 exf4 3. Bc4 Qh4+ ...\",\n  \"lessons\": [\"Primera lección general\", \"Segunda lección general\", \"Tercera lección general\"],\n  \"analysis\": [\n    {\n      \"san\": \"e4\",\n      \"title\": \"El peón de rey\",\n      \"explanation\": \"Ocupa el centro y abre las diagonales del alfil de f1 y de la dama.\",\n      \"pros\": \"Control central y desarrollo rápido.\",\n      \"cons\": \"El peón de e4 puede ser atacado.\",\n      \"phase\": \"apertura\",\n      \"concepts\": [\"Centro\"],\n      \"eval\": 0.3\n    },\n    {\n      \"san\": \"f4\",\n      \"title\": \"¡Gambito de Rey!\",\n      \"explanation\": \"Ofrece el peón de f para desviar el de e5 y construir un centro con d4.\",\n      \"pros\": \"Abre la columna f y prepara d4.\",\n      \"cons\": \"Debilita la diagonal e1-h4.\",\n      \"symbol\": \"!?\",\n      \"eval\": -0.6,\n      \"key\": true,\n      \"phase\": \"apertura\",\n      \"concepts\": [\"Gambito\", \"Columna abierta\"],\n      \"arrows\": [\"Rf4e5\", \"Gd2d4\"],\n      \"squares\": [\"Rf7\"],\n      \"question\": \"¿Qué gana el blanco a cambio del peón?\",\n      \"answer\": \"Tiempo, la columna f y la posibilidad de dominar el centro con d4.\",\n      \"lines\": [\n        { \"title\": \"Lo más habitual: 2.Nf3\", \"start\": \"before\", \"moves\": \"Nf3 Nc6 Bb5\", \"comment\": \"Desarrollo tranquilo sin entregar material.\" },\n        { \"title\": \"Si las negras rechazan el gambito: 2...Bc5\", \"start\": \"after\", \"moves\": \"Bc5 Nf3 d6\", \"comment\": \"El alfil vigila g1 y dificulta el enroque corto blanco.\" }\n      ]\n    }\n  ]\n}\n\n## Significado de cada campo\n- \"temas\" (en \"info\"): de 1 a 3 temas principales de la partida, del más al menos importante, elegidos SOLO de esta lista: Ataque al rey, Sacrificio y combinación, Apertura y desarrollo, Peón pasado, Peón aislado, Estructura de peones, Columnas y séptima fila, Casillas débiles y puestos avanzados, Profilaxis y zugzwang, Defensa y contraataque, Técnica de final.\n- \"nivel\" (en \"info\"): \"basico\", \"intermedio\" o \"avanzado\", según lo difícil que sea seguir la partida para un jugador de club.\n- Obligatorios: \"san\", \"title\", \"explanation\", \"pros\", \"cons\".\n- \"san\": la jugada en notación algebraica inglesa (K, Q, R, B, N), exactamente como en el PGN, sin número de jugada y sin símbolos ! o ?.\n- \"title\": título corto, sin número de jugada ni la propia jugada.\n- \"symbol\" (opcional): uno de !!, !, !?, ?!, ?, ??. Úsalos con criterio.\n- \"eval\" (opcional): valoración tras la jugada en peones, desde el punto de vista de las blancas (0.3, -1.5). Mate: \"#3\" si dan mate las blancas en 3, \"#-2\" si lo dan las negras en 2.\n- \"key\" (opcional): true solo en los 4-8 momentos clave.\n- \"phase\" (opcional): \"apertura\", \"medio juego\" o \"final\".\n- \"concepts\" (opcional): de 1 a 3 conceptos (Clavada, Desarrollo, Columna abierta, Sacrificio, Ataque doble, Peón pasado...).\n- \"arrows\" (opcional): flechas con el formato color + casilla de origen + casilla de destino. Colores: G verde (idea o plan), R rojo (amenaza), B azul (alternativa), Y amarillo (atención). Ejemplo: \"Rf3f7\".\n- \"squares\" (opcional): casillas destacadas con el mismo código de color: \"Rf7\".\n- \"question\" y \"answer\" (opcionales): pregunta para el alumno y su respuesta.\n- \"lines\" (opcional): variantes. \"start\": \"before\" si la variante sustituye a la jugada comentada (empieza en la posición anterior a ella) o \"after\" si continúa después de ella. \"moves\": jugadas en notación inglesa separadas por espacios, sin números.\n\n## Reglas críticas\n- \"analysis\" tiene EXACTAMENTE una entrada por cada media jugada y en orden: primero 1.e4, después 1...e5, después 2.Nf3...\n- Las flechas salen de la casilla de una pieza que existe en la posición tras la jugada comentada, y las casillas deben ser correctas.\n- Todo el texto en español. JSON válido: comillas dobles, sin comas finales, sin comentarios.\n- Antes de responder, revisa que el número de entradas de \"analysis\" coincide con el número de medias jugadas del PGN.\n";

// Convierte el texto de un archivo (JSON o PGN) en una lista de partidas JSON v2
function parseImport(text) {
  const t = String(text || '').replace(/^﻿/, '').trim();
  if (!t) throw new Error('El archivo está vacío');
  if (t[0] === '{' || /^\[\s*[{\]]/.test(t)) {
    let j;
    try { j = JSON.parse(t); }
    catch (e1) {
      try { j = JSON.parse(repairJson(t)); }
      catch (e2) { throw new Error('El JSON no es válido (' + e1.message + '). Pide a la IA que lo devuelva de nuevo como archivo .json.'); }
    }
    if (Array.isArray(j)) return j.filter(x => x && x.pgn);
    if (j && Array.isArray(j.games)) return j.games.filter(x => x && x.pgn);
    if (j && (j.pgn || Array.isArray(j.analysis))) return [j];
    throw new Error('El JSON no tiene el formato de Chess Analyzer (faltan "info", "pgn" y "analysis")');
  }
  const games = C.parsePGN(t).filter(g => g.moves.length);
  if (!games.length) throw new Error('No se han encontrado jugadas en el texto');
  return games.map(g => M.jsonFromPgnGame(g));
}
// Arreglos típicos de JSON generado por IA: bloques ```json, comas finales, comillas tipográficas
function repairJson(t) {
  let s = t.replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  s = s.replace(/[“”]/g, '"').replace(/,\s*([}\]])/g, '$1');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  return a >= 0 && b > a ? s.slice(a, b + 1) : s;
}

// Familia de apertura a partir de las primeras jugadas (no depende del ECO, que muchas partidas no traen)
function openingFamily(sans) {
  const s = sans.map(x => String(x).replace(/[+#!?]/g, ''));
  const w = s.filter((x, i) => i % 2 === 0).slice(0, 4), b = s.filter((x, i) => i % 2 === 1).slice(0, 4);
  if (!w.length) return '';
  if (w[0] === 'e4') {
    const r = b[0];
    if (r === 'e5') return 'abiertas';
    if (r === 'c5') return 'siciliana';
    if (r === 'e6' || r === 'c6') return 'francesa';
    return r ? 'otras-e4' : '';
  }
  const iD5 = b.indexOf('d5'), iNf6 = b.indexOf('Nf6'), iF5 = b.indexOf('f5'), d4 = w.includes('d4');
  if (iF5 >= 0 && (iD5 < 0 || iF5 < iD5) && (iNf6 < 0 || iF5 < iNf6)) return 'holandesa';
  if (d4 && iD5 >= 0 && (iNf6 < 0 || iD5 < iNf6)) return 'gambito-dama';
  if (d4 && iNf6 >= 0) return 'indias';
  if (w[0] === 'd4') return iD5 >= 0 ? 'gambito-dama' : 'holandesa';
  return 'flanco';
}
function canonTema(t) {
  const k = normKey(t);
  return TEMAS.find(x => normKey(x) === k) || String(t).trim();
}
function inferTemas(json) {
  const score = {};
  (json.analysis || []).forEach(a => (a && Array.isArray(a.concepts) ? a.concepts : []).forEach(c => {
    const k = normKey(c), hit = TEMA_DE_CONCEPTO.find(([re]) => re.test(k));
    if (hit) score[hit[1]] = (score[hit[1]] || 0) + (a.key ? 2 : 1);
  }));
  return Object.keys(score).filter(t => score[t] >= 2).sort((a, b) => score[b] - score[a]).slice(0, 3);
}
const META = new Map();
function gameMeta(json, source, file) {

async function syncGitHub(manual) {

    if (gh) {
      const r = await fetch(`https://api.github.com/repos/${gh.user}/${gh.repo}/contents/partidas`, { cache: 'no-store' });
      if (r.ok) {
        const arr = await r.json();
        if (Array.isArray(arr)) {
          const isGame = f => f.type === 'file' && /\.(json|pgn)$/i.test(f.name) && f.name !== 'index.json';
          names = arr.filter(isGame).map(f => f.name); how = 'api';

    try { const r = await fetch('partidas/index.json', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); names = (j.games || j.files || []).filter(x => typeof x === 'string'); how = how || 'index'; } } catch (e) { }
  }
  if (!names.length) {
    H.syncing = false;
    H.sync = gh ? { type: how === 'limit' ? 'err' : '', msg: how === 'limit' ? 'GitHub limita las consultas (60/hora). Vuelve a intentarlo más tarde.' : 'La carpeta partidas/ del repositorio está vacía o no existe.' } : (manual ? { type: 'err', msg: 'No se encontró partidas/index.json en este sitio.' } : null);
    if (!V.game) renderHome();
    return;
  }
  const fresh = [];
  for (const nm of names) {
    try {
      const r = await fetch('partidas/' + nm.split('/').map(encodeURIComponent).join('/'), { cache: 'no-cache' });
      if (!r.ok) continue;
      parseImport(await r.text()).forEach(g => { try { if (/^mias\//i.test(nm) && g.info && !g.info.coleccion) g.info.coleccion = 'mias'; M.build(g, 'github'); fresh.push({ json: g, file: nm }); } catch (e) { } });
    } catch (e) { }
  }
  let lib = getLib().filter(e => e.source !== 'github');
  fresh.forEach(({ json, file }) => {
    const id = M.makeId(json.info || {});
    lib = lib.filter(e => e.id !== id);
    lib.push({ id, source: 'github', data: json, file, added: Date.now() });
  });
  setLib(lib);
  save(KEYS.sync, { t: Date.now(), n: fresh.length });
  H.syncing = false;
  H.sync = { type: 'ok', msg: `${fresh.length} partida${fresh.length !== 1 ? 's' : ''} sincronizada${fresh.length !== 1 ? 's' : ''} desde GitHub` };
  if (!V.game) renderHome();
}

    `<polygon points="${tipX.toFixed(3)},${tipY.toFixed(3)} ${(bx + px).toFixed(3)},${(by + py).toFixed(3)} ${(bx - px).toFixed(3)},${(by - py).toFixed(3)}" fill="${col}"/>`;

function materialInfo(pos) {

    const missB = Math.max(0, (start[t] || 0) - (now[t] || 0)), missW = Math.max(0, (start[t.toUpperCase()] || 0) - (now[t.toUpperCase()] || 0));

/* ── Gráfica de valoración ── */
function graphEvals() {
  const g = V.game;
  if (V.scan) return V.scan.evals;
  if (!g.plies.some(p => p.note && p.note.eval)) return null;
  return g.positions.map((pos, i) => i === 0 ? { cp: 20 } : (g.plies[i - 1].note && g.plies[i - 1].note.eval) || terminalEval(pos) || null);
}
function updateGraph() {
  const el = $('#graph'), evs = graphEvals();
  if (!evs || V.mode === 'train') { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const n = evs.length - 1, W = 600, Hh = 84, y = ev => (Hh / 2) * (1 - M.winChance(ev));
  let last = { cp: 0 }, pts = [];
  evs.forEach((ev, i) => { if (ev) last = ev; pts.push([n ? (i / n) * W : 0, y(last)]); });
  const area = `M0,${Hh} ` + pts.map(p => `L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ') + ` L${W},${Hh} Z`;
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  let marks = '';
  if (V.stats) V.stats.ply.forEach((c, k) => { if (c && c.cls) marks += `<circle cx="${pts[k][0].toFixed(1)}" cy="${pts[k][1].toFixed(1)}" r="3.4" fill="var(--s-${c.cls === 'blun' ? 'blun' : c.cls === 'mist' ? 'mis' : 'dub'})"/>`; });
  V.game.plies.forEach((p, k) => { if (p.note && p.note.key) marks += `<rect x="${(pts[k + 1][0] - 2.5).toFixed(1)}" y="2" width="5" height="5" transform="rotate(45 ${pts[k + 1][0].toFixed(1)} 4.5)" fill="var(--gold)"/>`; });
  const cx = V.side ? (V.side.basePly / Math.max(1, n)) * W : (V.ply / Math.max(1, n)) * W;
  el.innerHTML = `<span class="gl">Ventaja ${V.scan ? '(' + esc(V.scan.by) + ')' : '(según el comentario)'}</span><svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" data-act="graph" role="img" aria-label="Gráfica de la valoración a lo largo de la partida">
    <rect width="${W}" height="${Hh}" fill="#2a2a2a"/><path d="${area}" fill="#ece7dc"/><path d="${line}" fill="none" stroke="var(--gold)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <line x1="0" x2="${W}" y1="${Hh / 2}" y2="${Hh / 2}" stroke="rgba(212,167,69,.6)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    ${marks}<line x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="0" y2="${Hh}" stroke="#d9534f" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ═══════════ Navegación, variantes, exploración, entrenamiento, motor ═══════════ */
let progTimer = null;

  clearTimeout(progTimer);
  const g = V.game; if (!g) return;
  progTimer = setTimeout(() => { if (V.game === g) setProg(g.id, { ply: V.ply }); }, 400);
}
function announce() {
  const live = $('#live'); if (!live) return;
  const mv = curMove();
  live.textContent = mv ? (mv.moveNumber + (mv.color === 'w' ? '. ' : '... ') + sanToSpeech(mv.san)) : 'Posición inicial';
}
function narrationText() {
  const mv = curMove();
  if (!mv) return '';
  let t = sanToSpeech(mv.san) + '.';
  if (!V.side) { const n = curNote(); if (n) t += ' ' + [n.title, n.explanation].filter(Boolean).join('. '); }
  return t;
}
function afterShow() {
  saveProgressSoon(); announce();

}
function openGameById(id, ply) {

}
function openGame(json, source, id, startPly) {
  let g;

  g.id = id || g.id;
  stopAutoplay(); Voice.stop();
  Object.assign(V, { game: g, side: null, mode: 'view', train: null, sel: -1, dests: [], promo: null, revealed: {}, answers: {}, flipped: false });
  V.eng.fen = ''; V.eng.lines = []; V.eng.error = '';
  V.scan = loadScan(g, json); V.stats = V.scan ? computeStats() : null;
  const prog = getProg()[g.id];

  V.ply = clamp(ply, 0, g.plies.length);
  save(KEYS.last, g.id);
  const hash = '#' + encodeURIComponent(g.id);
  if (location.hash !== hash) history.pushState({ g: g.id }, '', hash);
  renderViewer();
  window.scrollTo(0, 0);
  if (V.ply > 0 && startPly === undefined) toast('Continúas en ' + plainLabel(V.ply) + ' · ⏮ para empezar');
}
function goHome() {
  if (V.mode === 'train') stopTrain(true);
  V.eng.scanning && (V.eng.cancel = true);
  if (location.hash) history.pushState({}, '', location.pathname + location.search);
  renderHome();
}

/* ── Línea principal ── */
function go(ply, opts) {
  if (!V.game) return;
  opts = opts || {};
  if (V.side) V.side = null;
  ply = clamp(ply, 0, nPlies());
  const anim = ply === V.ply + 1;
  V.ply = ply; V.sel = -1; V.dests = []; V.promo = null;
  update({ animate: anim });
  afterShow();
}
function next() {
  if (V.mode === 'train') { if (V.train && !V.train.waiting) trainTick(); return; }
  if (V.side) return sideGo(V.side.idx + 1);
  if (V.ply < nPlies()) go(V.ply + 1);
}
function prev() {
  if (V.mode === 'train') return;
  if (V.side) { if (V.side.idx > 0) sideGo(V.side.idx - 1); else exitSide(); return; }
  go(V.ply - 1);
}
function first() { if (V.mode === 'train') return; if (V.side) return sideGo(0); go(0); }
function last() { if (V.mode === 'train') return; if (V.side) return sideGo(V.side.plies.length); go(nPlies()); }
function isKey(k) {
  const p = V.game.plies[k - 1], n = p && p.note, c = V.stats && V.stats.ply[k];
  return !!(n && (n.key || n.symbol === '!!' || n.symbol === '??')) || !!(c && c.cls === 'blun');
}
function nextKey(dir) {
  if (V.mode === 'train' || V.side) return;
  dir = dir || 1;
  for (let k = V.ply + dir; k >= 1 && k <= nPlies(); k += dir) if (isKey(k)) { go(k); return; }
  toast(dir > 0 ? 'No hay más momentos clave' : 'No hay momentos clave anteriores');
}
function flip() { V.flipped = !V.flipped; update({ noEngine: true }); }

/* ── Variantes (del comentario, del motor o propias) ── */
function openSide(o) {
  const start = V.game.positions[o.basePly];
  const r = C.playLine(start, (o.prefix || []).concat(o.sans || []));
  if (!r.plies.length && !o.editable) { toast('No se puede reproducir la variante' + (r.error ? ': «' + r.error.san + '» no es legal aquí' : '')); return false; }
  if (r.error) toast('Variante cortada en «' + r.error.san + '»: no es una jugada legal', 4000);
  stopAutoplay();
  V.side = { basePly: o.basePly, plies: r.plies, positions: r.positions, idx: Math.min(o.idx || 0, r.plies.length), title: o.title || '', comment: o.comment || '', editable: !!o.editable };
  V.sel = -1; V.dests = [];
  update();
  if (o.step) setTimeout(() => { if (V.side && V.side.idx < V.side.plies.length) sideGo(V.side.idx + 1); }, 320);
  return true;
}
function sideGo(i) {
  const s = V.side; if (!s) return;
  i = clamp(i, 0, s.plies.length);
  const anim = i === s.idx + 1;
  s.idx = i; V.sel = -1; V.dests = [];
  update({ animate: anim });
  announce();
  if (P.narrate && !V.autoplay) Voice.speak(narrationText());
}
function exitSide() { V.side = null; V.sel = -1; V.dests = []; stopAutoplay(); update(); }
function openNoteLine(k, j) {
  const L = V.game.plies[k - 1].note.lines[j];
  openSide({ basePly: L.start === 'after' ? k : k - 1, sans: C.movetextTokens(L.moves), title: L.title || 'Variante', comment: L.comment, step: true });
}
function openBestLine(k) {
  const pv = (V.scan.pv && V.scan.pv[k - 1]) ? V.scan.pv[k - 1].split(' ') : [V.scan.best[k - 1]];
  openSide({ basePly: k - 1, sans: pv, title: 'Mejor según ' + V.scan.by, step: true });
}
function openPv(j) {
  const l = V.eng.lines[j]; if (!l) return;
  if (V.side) openSide({ basePly: V.side.basePly, prefix: V.side.plies.slice(0, V.side.idx).map(p => p.uci), sans: l.pv, idx: V.side.idx, title: 'Línea del motor', step: true });
  else openSide({ basePly: V.ply, sans: l.pv, title: 'Línea del motor', step: true });
}

/* ── Interacción con el tablero ── */
function onSquare(d) {
  if (!(V.mode === 'explore' || trainWaiting()) || V.promo) return;
  const i = V.flipped ? 63 - d : d, pos = curPos(), p = pos.b[i];
  if (V.sel >= 0) {
    const c = V.dests.filter(m => m.to === i);
    if (c.length) { if (c.some(m => m.promo)) { V.promo = { cands: c }; V.sel = -1; V.dests = []; updateBoard(); return; } playUser(c[0]); return; }
  }
  if (p && C.colorOf(p) === pos.t && i !== V.sel) { V.sel = i; V.dests = C.legalMoves(pos).filter(m => m.from === i); }
  else { V.sel = -1; V.dests = []; }
  updateBoard();
}
function choosePromo(t) { const m = V.promo && V.promo.cands.find(x => x.promo === t); V.promo = null; if (m) playUser(m); else updateBoard(); }
function playUser(m) {
  V.sel = -1; V.dests = [];
  if (V.mode === 'train') return trainGuess(m);
  const uci = C.uciOf(m);
  if (!V.side) {
    const nm = V.game.plies[V.ply];
    if (nm && nm.uci === uci) { go(V.ply + 1); return; }
    V.side = { basePly: V.ply, plies: [], positions: [V.game.positions[V.ply]], idx: 0, title: '', comment: '', editable: true };
  }
  const s = V.side;
  if (s.idx < s.plies.length && s.plies[s.idx].uci === uci) { sideGo(s.idx + 1); return; }
  s.plies = s.plies.slice(0, s.idx); s.positions = s.positions.slice(0, s.idx + 1);
  const pos = s.positions[s.idx], legal = C.legalMoves(pos), san = C.toSan(pos, m, legal);
  s.plies.push({ san, uci, from: m.from, to: m.to, piece: m.piece, captured: m.captured, promo: m.promo, flag: m.flag, color: pos.t, moveNumber: pos.n });
  s.positions.push(C.makeMove(pos, m));
  s.editable = true; s.title = s.title && s.title.startsWith('Tu') ? s.title : ''; s.comment = '';
  s.idx++;
  update({ animate: true });
  announce();
}
function toggleExplore() {
  if (V.mode === 'explore') { V.mode = 'view'; V.sel = -1; V.dests = []; if (V.side && V.side.editable && !V.side.plies.length) V.side = null; update(); return; }
  if (V.mode === 'train') stopTrain(true);
  stopAutoplay();
  V.mode = 'explore'; update();
  toast('Toca una pieza y su destino para probar tus ideas');
}

/* ── Entrenamiento: adivina la jugada ── */
function startTrain(side, fromStart) {
  stopAutoplay(); Voice.stop();
  V.side = null; V.sel = -1; V.dests = [];
  if (engine.ready && !V.eng.scanning) engine.stop();
  V.eng.fen = '';
  if (fromStart) V.ply = 0;

  V.mode = 'train';

/* ── Motor ── */
const toWhite = (sc, turn) => !sc ? null : (typeof sc.mate === 'number' ? { mate: turn === 'w' ? sc.mate : -sc.mate } : { cp: turn === 'w' ? sc.cp : -sc.cp });
async function toggleEngine() {
  if (V.eng.on) {
    V.eng.on = false; V.eng.lines = []; V.eng.fen = '';
    if (engine.ready && !V.eng.scanning) engine.stop();
    update({ noEngine: true }); return;
  }
  V.eng.on = true; V.eng.error = ''; V.eng.status = 'Preparando el motor…';
  update({ noEngine: true });
  try {
    await engine.load(s => { V.eng.status = s; if (V.game) updateEngineBox(); });
    V.eng.status = '';
    if (V.game) update();
  } catch (e) {
    V.eng.on = false; V.eng.error = (e && e.message) || 'No se pudo cargar el motor';

  }
}

function runLive() {
  clearTimeout(liveTimer);
  if (!V.eng.on || !engine.ready || V.eng.scanning || !V.game) return;
  if (trainWaiting()) { engine.stop(); V.eng.fen = ''; return; }
  liveTimer = setTimeout(() => {
    if (!V.game) return;
    const pos = curPos(), fen = C.toFen(pos);
    if (fen === V.eng.fen) return;
    V.eng.fen = fen; V.eng.lines = [];
    if (['mate', 'stalemate', 'insufficient'].includes(C.status(pos))) { engine.stop(); updateEngineBox(); return; }
    engine.analyze({
      fen, depth: 24, multipv: 2, onInfo: inf => {
        if (V.eng.fen !== fen) return;
        V.eng.lines[inf.multipv - 1] = { score: toWhite(inf.score, pos.t), pv: inf.pv, depth: inf.depth, fen };

}

  for (let i = 0; i < n; i++) {

      if (r.cancelled || !r.score) { if (r.cancelled) break; }

function stopScan() { V.eng.cancel = true; engine.stop(); }
